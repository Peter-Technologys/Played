name: One-shot Now Playing visual migration

on:
  push:
    paths:
      - '.github/workflows/one-shot-now-playing-polish.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Modernize Now Playing primary control
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/player/presentation/audio_player_screen.dart')
          s = p.read_text()
          old = '''      // Gradient play button (doubles as retry button when load timed out)'''
          s = s.replace(old, '''                  // Primary play button (also retries a timed-out load)''')
          old_decoration = '''                      decoration: BoxDecoration(\n                        shape: BoxShape.circle,\n                        gradient: const LinearGradient(\n                          colors: [AppColors.accent, AppColors.accentViolet],\n                          begin: Alignment.topLeft,\n                          end: Alignment.bottomRight,\n                        ),\n                        boxShadow: [\n                          BoxShadow(\n                            color: AppColors.accent.withValues(alpha: 0.45),\n                            blurRadius: 28, spreadRadius: 4,\n                          ),\n                          BoxShadow(\n                            color: AppColors.accentViolet.withValues(alpha: 0.25),\n                            blurRadius: 60, spreadRadius: 8,\n                          ),\n                        ],\n                      ),'''
          new_decoration = '''                      decoration: BoxDecoration(\n                        shape: BoxShape.circle,\n                        color: AppColors.accent,\n                        boxShadow: [\n                          BoxShadow(\n                            color: AppColors.accent.withValues(alpha: 0.24),\n                            blurRadius: 18,\n                            spreadRadius: 1,\n                            offset: const Offset(0, 8),\n                          ),\n                        ],\n                      ),'''
          if old_decoration not in s:
              raise SystemExit('Expected Now Playing decoration block not found')
          s = s.replace(old_decoration, new_decoration)
          s = s.replace('''CircularProgressIndicator(\n                                  color: Colors.black, strokeWidth: 2)''', '''CircularProgressIndicator(\n                                  color: Colors.white, strokeWidth: 2)''')
          s = s.replace('''child: Icon(Icons.refresh_rounded,\n                                      color: Colors.black, size: 30)''', '''child: Icon(Icons.refresh_rounded,\n                                      color: Colors.white, size: 30)''')
          s = s.replace('''                                  color: Colors.black, size: 38,''', '''                                  color: Colors.white, size: 38,''')
          p.write_text(s)
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/player/presentation/audio_player_screen.dart
          git commit -m 'Modernize Now Playing primary controls'
          git push
