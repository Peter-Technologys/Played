name: OTYA UI polish migration

on:
  push:
    paths:
      - '.github/workflows/one-shot-ui-polish.yml'
      - 'scripts/apply_ui_polish.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply UI and theme migration
        run: python3 scripts/apply_ui_polish.py
      - name: Commit source changes
        run: |
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add pubspec.yaml lib
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Polish theme cards, Hub tools and library backgrounds'
          git push
