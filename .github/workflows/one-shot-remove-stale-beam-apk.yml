name: Remove stale Beam APK action
on:
  push:
    paths:
      - .github/workflows/one-shot-remove-stale-beam-apk.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete APK Beam code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/features/air_drop/presentation/air_drop_screen.dart')
          s = p.read_text()
          start = s.find('  Future<void> shareApk() async {')
          if start >= 0:
              end = s.find('\n  void stopSending()', start)
              if end >= 0:
                  s = s[:start] + s[end+1:]
          marker = '          // Share APK\n'
          start = s.find(marker)
          if start >= 0:
              end_marker = '          // File list\n'
              end = s.find(end_marker, start)
              if end >= 0:
                  s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - name: Commit source repair
        run: |
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/air_drop/presentation/air_drop_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove obsolete Beam APK action'
          git push
