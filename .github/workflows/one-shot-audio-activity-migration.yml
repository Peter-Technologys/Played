name: One-shot audio activity migration

on:
  push:
    paths:
      - '.github/workflows/one-shot-audio-activity-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Switch MainActivity to AudioServiceActivity
        shell: bash
        run: |
          set -euo pipefail
          file='android/app/src/main/kotlin/com/otyaplayer/app/MainActivity.kt'
          sed -i 's/import io\.flutter\.embedding\.android\.FlutterActivity/import com.ryanheise.audioservice.AudioServiceActivity/' "$file"
          sed -i 's/class MainActivity : FlutterActivity()/class MainActivity : AudioServiceActivity()/' "$file"
          grep -q 'import com.ryanheise.audioservice.AudioServiceActivity' "$file"
          grep -q 'class MainActivity : AudioServiceActivity()' "$file"
      - name: Commit migration if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Migration already applied.'
            exit 0
          fi
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add android/app/src/main/kotlin/com/otyaplayer/app/MainActivity.kt
          git commit -m 'Integrate MainActivity with audio_service'
          git push
