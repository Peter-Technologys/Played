# ───────────────────────────────────────────────────────────────
# OTYA Player — GitHub Actions Release Pipeline
#
# Triggers on v* tags (e.g. v1.3.3) pushed to GitHub.
#
# Required Secrets:
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   APPWRITE_API_KEY, CF_API_TOKEN
#
# Required Variables:
#   GOOGLE_SERVICES_JSON, R2_ENDPOINT, R2_BUCKET
#   APPWRITE_ENDPOINT, APPWRITE_PROJECT_ID
#   WORKER_URL, CF_ACCOUNT_ID, KV_NAMESPACE_ID
# ───────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.3.3)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  build_and_publish:
    name: Build Signed Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - name: Install dependencies
        run: |
          pip install awscli --quiet
          flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write google-services.json
        run: echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build split APKs (arm64 + arm32)
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/debug-info

      - name: Remove secrets
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/app/google-services.json

      - name: Verify APK output files
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk || { echo "ERROR: arm64 APK not found"; exit 1; }
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk || { echo "ERROR: arm32 APK not found"; exit 1; }
          ARM64_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          ARM32_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk)
          [ "$ARM64_SIZE" -gt 5000000 ] || { echo "ERROR: arm64 APK too small ($ARM64_SIZE bytes)"; exit 1; }
          [ "$ARM32_SIZE" -gt 5000000 ] || { echo "ERROR: arm32 APK too small ($ARM32_SIZE bytes)"; exit 1; }
          echo "arm64: $ARM64_SIZE bytes OK"
          echo "arm32: $ARM32_SIZE bytes OK"

      - name: Resolve APK paths
        id: apk
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          echo "arm64=$APK_DIR/app-arm64-v8a-release.apk" >> $GITHUB_OUTPUT
          echo "arm32=$APK_DIR/app-armeabi-v7a-release.apk" >> $GITHUB_OUTPUT

      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          ARM64_APK: ${{ steps.apk.outputs.arm64 }}
          ARM32_APK: ${{ steps.apk.outputs.arm32 }}
        run: bash scripts/publish_r2.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ${{ steps.apk.outputs.arm64 }}
            ${{ steps.apk.outputs.arm32 }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.arm64 }}
            ${{ steps.apk.outputs.arm32 }}
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ github.ref_name }}
          path: build/debug-info/
          retention-days: 30
