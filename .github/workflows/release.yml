# OTYA Player — GitHub Actions Release Pipeline
# Production releases are signed only with the configured release keystore.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.3.3)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build_and_publish:
    name: Build Signed Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - name: Install dependencies
        run: |
          pip install awscli --quiet
          flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write google-services.json
        run: |
          test -n '${{ vars.GOOGLE_SERVICES_JSON }}' || { echo "ERROR: GOOGLE_SERVICES_JSON is missing"; exit 1; }
          printf '%s' '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode release keystore
        run: |
          test -n '${{ secrets.KEYSTORE_BASE64 }}' || { echo "ERROR: Release keystore secret is missing"; exit 1; }
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks || { echo "ERROR: Release keystore is empty"; exit 1; }

      - name: Build split signed APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "ERROR: STORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: KEY_PASSWORD is missing"; exit 1; }

          rm -rf build/app/outputs/flutter-apk android/app/build/outputs/flutter-apk android/app/build/outputs/apk/release
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/debug-info

      - name: Remove secrets
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/app/google-services.json

      - name: Verify APK output files
        run: |
          mkdir -p build/app/outputs/flutter-apk
          find android/app/build/outputs -type f -name '*.apk' -exec cp {} build/app/outputs/flutter-apk/ \;
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk || { echo "ERROR: arm64 APK not found"; exit 1; }
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk || { echo "ERROR: arm32 APK not found"; exit 1; }
          ARM64_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          ARM32_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk)
          [ "$ARM64_SIZE" -gt 5000000 ] || { echo "ERROR: arm64 APK suspiciously small ($ARM64_SIZE bytes)"; exit 1; }
          [ "$ARM32_SIZE" -gt 5000000 ] || { echo "ERROR: arm32 APK suspiciously small ($ARM32_SIZE bytes)"; exit 1; }
          sha256sum build/app/outputs/flutter-apk/*.apk

      - name: Resolve APK paths
        id: apk
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          echo "arm64=$APK_DIR/app-arm64-v8a-release.apk" >> "$GITHUB_OUTPUT"
          echo "arm32=$APK_DIR/app-armeabi-v7a-release.apk" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          ARM64_APK: ${{ steps.apk.outputs.arm64 }}
          ARM32_APK: ${{ steps.apk.outputs.arm32 }}
        run: bash scripts/publish_r2.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.arm64 }}
            ${{ steps.apk.outputs.arm32 }}

      - name: Prepare release metadata
        id: meta
        run: |
          ARM64_SIZE=$(du -sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -f1)
          ARM32_SIZE=$(du -sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | cut -f1)
          CHANGELOG=$(awk '/^## \[/{found++} found==1{print} found==2{exit}' CHANGELOG.md \
            | tail -n +2 | grep -v '^[[:space:]]*$' | head -20 \
            | sed 's/### //g; s/^- /• /g' \
            | tr '\n' '|' | sed 's/|$//')
          [ -z "$CHANGELOG" ] && CHANGELOG="Bug fixes and improvements"
          echo "arm64_size=$ARM64_SIZE" >> "$GITHUB_OUTPUT"
          echo "arm32_size=$ARM32_SIZE" >> "$GITHUB_OUTPUT"
          printf '%s' "$CHANGELOG" > /tmp/changelog.txt

      - name: Remove any remaining secret material
        if: always()
        run: |
          rm -f android/app/keystore.jks android/app/google-services.json
