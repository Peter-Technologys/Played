# ───────────────────────────────────────────────────────────────
# OTYA Player — GitHub Actions Release Pipeline
#
# Triggers on v* tags (e.g. v1.3.3) pushed to GitHub.
#
# Required Secrets:
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   APPWRITE_API_KEY, CF_API_TOKEN
#
# Required Variables:
#   GOOGLE_SERVICES_JSON, R2_ENDPOINT, R2_BUCKET
#   APPWRITE_ENDPOINT, APPWRITE_PROJECT_ID
#   WORKER_URL, CF_ACCOUNT_ID, KV_NAMESPACE_ID
# ───────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.3.3)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build_and_publish:
    name: Build Signed Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - name: Install dependencies
        run: |
          pip install awscli --quiet
          flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write google-services.json
        run: echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build split APKs (arm64 + arm32)
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/debug-info

      - name: Remove secrets
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/app/google-services.json

      - name: Verify APK output files
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk || { echo "ERROR: arm64 APK not found"; exit 1; }
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk || { echo "ERROR: arm32 APK not found"; exit 1; }
          ARM64_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          ARM32_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk)
          [ "$ARM64_SIZE" -gt 5000000 ] || { echo "ERROR: arm64 APK too small ($ARM64_SIZE bytes)"; exit 1; }
          [ "$ARM32_SIZE" -gt 5000000 ] || { echo "ERROR: arm32 APK too small ($ARM32_SIZE bytes)"; exit 1; }
          echo "arm64: $ARM64_SIZE bytes OK"
          echo "arm32: $ARM32_SIZE bytes OK"

      - name: Resolve APK paths
        id: apk
        run: |
          APK_DIR=build/app/outputs/flutter-apk
          echo "arm64=$APK_DIR/app-arm64-v8a-release.apk" >> $GITHUB_OUTPUT
          echo "arm32=$APK_DIR/app-armeabi-v7a-release.apk" >> $GITHUB_OUTPUT

      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          ARM64_APK: ${{ steps.apk.outputs.arm64 }}
          ARM32_APK: ${{ steps.apk.outputs.arm32 }}
        run: bash scripts/publish_r2.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ${{ steps.apk.outputs.arm64 }}
            ${{ steps.apk.outputs.arm32 }}

      # APKs are already published to Cloudflare R2 and attached to the
      # GitHub Release above — no need to store them as Actions artifacts.

      - name: Prepare release metadata
        id: meta
        run: |
          ARM64_SIZE=$(du -sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -f1)
          ARM32_SIZE=$(du -sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | cut -f1)
          CHANGELOG=$(awk '/^## \[/{found++} found==1{print} found==2{exit}' CHANGELOG.md \
            | tail -n +2 | grep -v '^[[:space:]]*$' | head -20 \
            | sed 's/### //g; s/^- /• /g' \
            | tr '\n' '|' | sed 's/|$//')
          [ -z "$CHANGELOG" ] && CHANGELOG="Bug fixes and improvements"
          echo "arm64_size=$ARM64_SIZE" >> $GITHUB_OUTPUT
          echo "arm32_size=$ARM32_SIZE" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" > /tmp/changelog.txt
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo '')
          if [ -n "$PREV_TAG" ]; then
            COMMIT_COUNT=$(git rev-list ${PREV_TAG}..HEAD --count 2>/dev/null || echo '?')
          else
            COMMIT_COUNT=$(git rev-list HEAD --count 2>/dev/null || echo '?')
          fi
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Telegram — send announcement
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TAG: ${{ github.ref_name }}
          ARM64_SIZE: ${{ steps.meta.outputs.arm64_size }}
          ARM32_SIZE: ${{ steps.meta.outputs.arm32_size }}
          COMMIT_COUNT: ${{ steps.meta.outputs.commit_count }}
          PREV_TAG: ${{ steps.meta.outputs.prev_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, urllib.parse, json
          tag          = os.environ['TAG']
          arm64_size   = os.environ['ARM64_SIZE']
          arm32_size   = os.environ['ARM32_SIZE']
          commit_count = os.environ['COMMIT_COUNT']
          prev_tag     = os.environ.get('PREV_TAG', '')
          run_url      = os.environ['RUN_URL']
          release_url  = os.environ['RELEASE_URL']
          download_url = os.environ.get('WORKER_URL', 'https://petersmartlink.com') + '/download/otya-player'
          bot_token    = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id      = os.environ['TELEGRAM_CHAT_ID']
          with open('/tmp/changelog.txt') as f:
              raw = f.read().strip()
          lines = [l.strip() for l in raw.split('|') if l.strip()][:15]
          changelog_html = '\n'.join(
              f'  • {l.lstrip("•- ")}' if not l.startswith('#') else f'\n<b>{l.lstrip("# ")}</b>'
              for l in lines
          )
          compare_line = ''
          if prev_tag:
              compare_line = f'\n\u{1F500} <b>Changes since {prev_tag}:</b> {commit_count} commits'
          msg = (
              f'\U0001F3B5 <b>OTYA Player {tag} is out!</b>\n'
              f'\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\n'
              f'\U0001F4CB <b>What\'s new:</b>\n{changelog_html}{compare_line}\n\n'
              f'\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n'
              f'\U0001F4E6 <b>Download APKs:</b>\n'
              f'  \U0001F4F1 <a href="{release_url}">arm64 ({arm64_size}) \u2014 64-bit devices</a>\n'
              f'  \U0001F4F1 <a href="{release_url}">arm32 ({arm32_size}) \u2014 32-bit devices</a>\n\n'
              f'\U0001F310 <a href="{download_url}">Download from website</a>\n'
              f'\U0001F4DD <a href="{release_url}">Full release notes on GitHub</a>\n'
              f'\U0001F527 <a href="{run_url}">CI build log</a>\n\n'
              f'\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n'
              f'<i>APK files are attached below \u2193</i>'
          )
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML', 'disable_web_page_preview': 'true'}).encode()
          req = urllib.request.Request(f'https://api.telegram.org/bot{bot_token}/sendMessage', data=data, method='POST')
          with urllib.request.urlopen(req) as resp:
              result = json.load(resp)
              print('Message sent, id:', result['result']['message_id'])
          PYEOF

      - name: Telegram — upload arm64 APK
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "/tmp/OtyaPlayer-${TAG}-arm64.apk"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@/tmp/OtyaPlayer-${TAG}-arm64.apk" \
            -F "caption=📱 <b>OTYA Player ${TAG}</b> — arm64 (64-bit devices)" \
            -F "parse_mode=HTML" \
            --fail-with-body

      - name: Telegram — upload arm32 APK
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "/tmp/OtyaPlayer-${TAG}-arm32.apk"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@/tmp/OtyaPlayer-${TAG}-arm32.apk" \
            -F "caption=📱 <b>OTYA Player ${TAG}</b> — arm32 (32-bit devices)" \
            -F "parse_mode=HTML" \
            --fail-with-body

      - name: Telegram — notify failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="❌ <b>OTYA Player ${TAG} release FAILED</b>\n\nThe build failed — please check the CI log for details.\n\n🔧 <a href='${RUN_URL}'>View build log</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            --fail-with-body || true
