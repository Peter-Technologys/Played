# OTYA Player — GitHub Actions Release Pipeline
# Production releases are signed only with the configured release keystore.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  build_and_publish:
    name: Build, verify and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG='${{ inputs.tag }}'
          else
            TAG='${{ github.ref_name }}'
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERROR: invalid release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify release tag exists
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || {
            echo "ERROR: release tag $RELEASE_TAG does not exist in the repository"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install awscli --quiet
          flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee build/flutter-analyze-release.log

      - name: Run tests
        run: flutter test

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ secrets.KEYSTORE_BASE64 }}' || { echo "ERROR: Release keystore secret is missing"; exit 1; }
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks || { echo "ERROR: Release keystore is empty"; exit 1; }

      - name: Build signed APKs and app bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "ERROR: STORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: KEY_PASSWORD is missing"; exit 1; }
          test -n "$FIREBASE_API_KEY" || { echo "ERROR: FIREBASE_API_KEY GitHub variable is missing"; exit 1; }

          GOOGLE_WEB_CLIENT_ID='82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com'
          FIREBASE_APP_ID='1:82776565585:android:085cf9b4eecb76e9535570'
          FIREBASE_MESSAGING_SENDER_ID='82776565585'
          FIREBASE_PROJECT_ID='otya-player'
          EXTRA_DEFINES=(
            --dart-define=SELF_UPDATE=true
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          )

          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/debug-info \
            "${EXTRA_DEFINES[@]}"
          flutter build appbundle --release \
            --split-debug-info=build/debug-info \
            "${EXTRA_DEFINES[@]}"

      - name: Verify release outputs
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR=build/app/outputs/flutter-apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          ARM64="$APK_DIR/app-arm64-v8a-release.apk"
          ARM32="$APK_DIR/app-armeabi-v7a-release.apk"

          test -f "$ARM64" || { echo "ERROR: arm64 APK not found"; exit 1; }
          test -f "$ARM32" || { echo "ERROR: arm32 APK not found"; exit 1; }
          test -f "$AAB" || { echo "ERROR: Android App Bundle not found"; exit 1; }
          [ "$(stat -c%s "$ARM64")" -gt 5000000 ] || { echo "ERROR: arm64 APK suspiciously small"; exit 1; }
          [ "$(stat -c%s "$ARM32")" -gt 5000000 ] || { echo "ERROR: arm32 APK suspiciously small"; exit 1; }
          [ "$(stat -c%s "$AAB")" -gt 5000000 ] || { echo "ERROR: AAB suspiciously small"; exit 1; }

          sha256sum "$ARM64" "$ARM32" "$AAB" | tee build/release-sha256.txt
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
          echo "arm32=$ARM32" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otya-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.artifacts.outputs.arm64 }}
            ${{ steps.artifacts.outputs.arm32 }}
            ${{ steps.artifacts.outputs.aab }}
            build/release-sha256.txt
            build/flutter-analyze-release.log

      - name: Publish APKs to Cloudflare R2
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          OTYA_STORE_ADMIN_TOKEN: ${{ secrets.OTYA_STORE_ADMIN_TOKEN }}
          ARM64_APK: ${{ steps.artifacts.outputs.arm64 }}
          ARM32_APK: ${{ steps.artifacts.outputs.arm32 }}
        run: bash scripts/publish_r2.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifacts.outputs.arm64 }}
            ${{ steps.artifacts.outputs.arm32 }}
            ${{ steps.artifacts.outputs.aab }}
            build/release-sha256.txt

      - name: Remove secret material
        if: always()
        run: rm -f android/app/keystore.jks
