# Otya release pipeline
# Public files use one simple product name: Otya.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  build_and_publish:
    name: Build and publish Otya
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write

    steps:
      - name: Get release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG='${{ inputs.tag }}'
          else
            TAG='${{ github.ref_name }}'
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERROR: invalid release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Check release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || {
            echo "ERROR: release tag $RELEASE_TAG does not exist"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install awscli --quiet
          flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flutter analyze 2>&1 | tee build/flutter-analyze-release.log

      - name: Run tests
        run: flutter test

      - name: Load signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ secrets.KEYSTORE_BASE64 }}' || { echo "ERROR: Release signing key is missing"; exit 1; }
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks || { echo "ERROR: Release signing key is empty"; exit 1; }

      - name: Build APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "ERROR: STORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: KEY_PASSWORD is missing"; exit 1; }
          test -n "$FIREBASE_API_KEY" || { echo "ERROR: FIREBASE_API_KEY is missing"; exit 1; }

          GOOGLE_WEB_CLIENT_ID='82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com'
          FIREBASE_APP_ID='1:82776565585:android:085cf9b4eecb76e9535570'
          FIREBASE_MESSAGING_SENDER_ID='82776565585'
          FIREBASE_PROJECT_ID='otya-player'
          COMMON_DEFINES=(
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          )

          rm -rf build/app/outputs/flutter-apk build/app/outputs/bundle build/release
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --split-debug-info=build/debug-info \
            --dart-define=SELF_UPDATE=true \
            "${COMMON_DEFINES[@]}"

      - name: Build Play Store bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          GOOGLE_WEB_CLIENT_ID='82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com'
          FIREBASE_APP_ID='1:82776565585:android:085cf9b4eecb76e9535570'
          FIREBASE_MESSAGING_SENDER_ID='82776565585'
          FIREBASE_PROJECT_ID='otya-player'
          flutter build appbundle --release \
            --split-debug-info=build/debug-info \
            --dart-define=SELF_UPDATE=false \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"

      - name: Name and verify Otya files
        id: artifacts
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR=build/app/outputs/flutter-apk
          RAW_AAB=build/app/outputs/bundle/release/app-release.aab
          RAW_ARM64="$APK_DIR/app-arm64-v8a-release.apk"
          RAW_ARM32="$APK_DIR/app-armeabi-v7a-release.apk"
          OUT=build/release
          mkdir -p "$OUT"

          test -f "$RAW_ARM64" || { echo "ERROR: arm64 APK not found"; exit 1; }
          test -f "$RAW_ARM32" || { echo "ERROR: arm32 APK not found"; exit 1; }
          test -f "$RAW_AAB" || { echo "ERROR: app bundle not found"; exit 1; }

          cp "$RAW_ARM64" "$OUT/Otya-arm64.apk"
          cp "$RAW_ARM32" "$OUT/Otya-arm32.apk"
          cp "$RAW_AAB" "$OUT/Otya.aab"

          ARM64="$OUT/Otya-arm64.apk"
          ARM32="$OUT/Otya-arm32.apk"
          AAB="$OUT/Otya.aab"
          ARM64_REPORT="$OUT/Otya-arm64-signing.txt"
          ARM32_REPORT="$OUT/Otya-arm32-signing.txt"
          AAB_REPORT="$OUT/Otya-aab-signing.txt"

          [ "$(stat -c%s "$ARM64")" -gt 5000000 ] || { echo "ERROR: arm64 APK is too small"; exit 1; }
          [ "$(stat -c%s "$ARM32")" -gt 5000000 ] || { echo "ERROR: arm32 APK is too small"; exit 1; }
          [ "$(stat -c%s "$AAB")" -gt 5000000 ] || { echo "ERROR: app bundle is too small"; exit 1; }

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER" || { echo "ERROR: Android apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$ARM64" | tee "$ARM64_REPORT"
          "$APKSIGNER" verify --verbose --print-certs "$ARM32" | tee "$ARM32_REPORT"

          EXPECTED_SHA256="$(keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          test -n "$EXPECTED_SHA256" || { echo "ERROR: expected signing certificate is unavailable"; exit 1; }

          for REPORT in "$ARM64_REPORT" "$ARM32_REPORT"; do
            ACTUAL_SHA256="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$REPORT" \
              | head -n 1 \
              | tr -d ':[:space:]' \
              | tr '[:upper:]' '[:lower:]')"
            test -n "$ACTUAL_SHA256" || { echo "ERROR: APK signing certificate was not reported"; exit 1; }
            test "$EXPECTED_SHA256" = "$ACTUAL_SHA256" || {
              echo "ERROR: release APK certificate does not match the configured Otya signing key"
              exit 1
            }
          done

          jarsigner -verify "$AAB" | tee "$AAB_REPORT"
          keytool -printcert -jarfile "$AAB" >> "$AAB_REPORT"
          AAB_SHA256="$(sed -n 's/^[[:space:]]*SHA256: //p' "$AAB_REPORT" \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          test -n "$AAB_SHA256" || { echo "ERROR: app bundle signing certificate was not reported"; exit 1; }
          test "$EXPECTED_SHA256" = "$AAB_SHA256" || {
            echo "ERROR: app bundle certificate does not match the configured Otya signing key"
            exit 1
          }

          sha256sum "$ARM64" "$ARM32" "$AAB" | tee "$OUT/checksums.txt"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
          echo "arm32=$ARM32" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "checksums=$OUT/checksums.txt" >> "$GITHUB_OUTPUT"
          echo "arm64_signing=$ARM64_REPORT" >> "$GITHUB_OUTPUT"
          echo "arm32_signing=$ARM32_REPORT" >> "$GITHUB_OUTPUT"
          echo "aab_signing=$AAB_REPORT" >> "$GITHUB_OUTPUT"

      - name: Save Otya release files
        uses: actions/upload-artifact@v4
        with:
          name: Otya-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.artifacts.outputs.arm64 }}
            ${{ steps.artifacts.outputs.arm32 }}
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.checksums }}
            ${{ steps.artifacts.outputs.arm64_signing }}
            ${{ steps.artifacts.outputs.arm32_signing }}
            ${{ steps.artifacts.outputs.aab_signing }}
            build/flutter-analyze-release.log

      - name: Publish Otya APKs
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          OTYA_STORE_ADMIN_TOKEN: ${{ secrets.OTYA_STORE_ADMIN_TOKEN }}
          ARM64_APK: ${{ steps.artifacts.outputs.arm64 }}
          ARM32_APK: ${{ steps.artifacts.outputs.arm32 }}
        run: bash scripts/publish_r2.sh

      - name: Create Otya release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Otya ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifacts.outputs.arm64 }}
            ${{ steps.artifacts.outputs.arm32 }}
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.checksums }}

      - name: Remove signing key
        if: always()
        run: rm -f android/app/keystore.jks
