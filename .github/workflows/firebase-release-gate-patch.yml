name: One-shot Firebase release gate patch

on:
  push:
    branches: [v1-rebuild]
    paths:
      - '.github/workflows/firebase-release-gate-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1-rebuild
          fetch-depth: 0
      - name: Apply exact workflow hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} match(es), found {actual}')
              p.write_text(text.replace(old, new, count))

          rep('.github/workflows/debug.yml',
              '''          if [ -n "$FIREBASE_API_KEY" ]; then\n            ARGS+=(\n              --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"\n              --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"\n              --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"\n              --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"\n            )\n            echo "Firebase client configuration enabled for verified OTYA project."\n          else\n            echo "NOTICE: FIREBASE_API_KEY is missing; APK will build with remote Firebase services disabled."\n          fi''',
              '''          test -n "$FIREBASE_API_KEY" || { echo "ERROR: FIREBASE_API_KEY GitHub Actions variable is missing; verified release APKs must include Firebase client configuration."; exit 1; }\n          ARGS+=(\n            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"\n            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"\n            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"\n            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"\n          )\n          echo "Firebase client configuration enabled for verified OTYA project."''')

          rep('.github/workflows/release.yml', 'uses: actions/checkout@v4', 'uses: actions/checkout@v5')
          rep('.github/workflows/release.yml',
              'flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee build/flutter-analyze-release.log',
              'flutter analyze 2>&1 | tee build/flutter-analyze-release.log')
          PY
          git diff --check
      - name: Commit exact hardening
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/firebase-release-gate-patch.yml
          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/debug.yml .github/workflows/release.yml
          git diff --cached --check
          git commit -m 'fix: require Firebase config for verified builds'
          git push origin HEAD:v1-rebuild
