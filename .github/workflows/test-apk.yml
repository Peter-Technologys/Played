name: Test APK — current head

on:
  push:
    branches: [v1-rebuild]
  pull_request:
    branches: [v1-rebuild]
  workflow_dispatch:

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  validate_and_build:
    name: Analyze, test and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact current head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Verify Firebase test configuration
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_API_KEY" || { echo "ERROR: FIREBASE_API_KEY GitHub variable is missing"; exit 1; }

      - name: Prepare stable Android signing for Google Sign-In
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            test -s android/app/keystore.jks || { echo "ERROR: decoded keystore is empty"; exit 1; }
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Stable Otya signing key prepared for the test APK."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: release signing secrets are incomplete. The APK will use the runner debug certificate; Google Sign-In may reject that build unless its SHA is registered."
          fi

      - name: Build non-publishing ARM64 test APK
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.available == 'true' && format('{0}/android/app/keystore.jks', github.workspace) || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --target-platform android-arm64 \
            --dart-define=SELF_UPDATE=true \
            --dart-define=GOOGLE_WEB_CLIENT_ID="82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="1:82776565585:android:085cf9b4eecb76e9535570" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="82776565585" \
            --dart-define=FIREBASE_PROJECT_ID="otya-player"

      - name: Verify APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$APK" || { echo "ERROR: test APK not found"; exit 1; }
          test "$(stat -c%s "$APK")" -gt 5000000 || { echo "ERROR: APK suspiciously small"; exit 1; }
          sha256sum "$APK" | tee build/test-apk-sha256.txt
          keytool -printcert -jarfile "$APK" | tee build/test-apk-signing-cert.txt

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: otya-current-head-test-apk
          if-no-files-found: error
          retention-days: 7
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/test-apk-sha256.txt
            build/test-apk-signing-cert.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks
