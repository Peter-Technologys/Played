name: Test Otya

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-otya-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  validate_and_build:
    name: Check and build Otya
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Check Firebase settings
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_API_KEY" || { echo "ERROR: FIREBASE_API_KEY is missing"; exit 1; }

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "ERROR: KEYSTORE_BASE64 is missing; the installable test APK must use Otya's stable signing identity"; exit 1; }
          test -n "${STORE_PASSWORD:-}" || { echo "ERROR: STORE_PASSWORD is missing"; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "ERROR: KEY_ALIAS is missing"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "ERROR: KEY_PASSWORD is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks || { echo "ERROR: signing key is empty"; exit 1; }

      - name: Build test APK
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --target-platform android-arm64 \
            --dart-define=SELF_UPDATE=true \
            --dart-define=GOOGLE_WEB_CLIENT_ID="82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="1:82776565585:android:085cf9b4eecb76e9535570" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="82776565585" \
            --dart-define=FIREBASE_PROJECT_ID="otya-player"
          cp build/app/outputs/flutter-apk/app-debug.apk build/Otya-test.apk

      - name: Verify test APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/Otya-test.apk
          SIGNING_REPORT=build/Otya-test-signing.txt
          test -f "$APK" || { echo "ERROR: Otya test APK not found"; exit 1; }
          test "$(stat -c%s "$APK")" -gt 5000000 || { echo "ERROR: APK is too small"; exit 1; }
          sha256sum "$APK" | tee build/Otya-test-checksum.txt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER" || { echo "ERROR: Android apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$SIGNING_REPORT"

          EXPECTED_SHA256="$(keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$SIGNING_REPORT" \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"

          test -n "$EXPECTED_SHA256" || { echo "ERROR: could not read the expected signing certificate"; exit 1; }
          test -n "$ACTUAL_SHA256" || { echo "ERROR: APK signing certificate was not reported"; exit 1; }
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256" || {
            echo "ERROR: test APK certificate does not match the configured Otya signing key"
            exit 1
          }

      - name: Save Otya test APK
        uses: actions/upload-artifact@v4
        with:
          name: Otya-test
          if-no-files-found: error
          retention-days: 7
          path: |
            build/Otya-test.apk
            build/Otya-test-checksum.txt
            build/Otya-test-signing.txt

      - name: Remove signing key
        if: always()
        run: rm -f android/app/keystore.jks
