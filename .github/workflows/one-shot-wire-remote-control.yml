name: OTYA remote control wiring

on:
  push:
    paths:
      - '.github/workflows/one-shot-wire-remote-control.yml'
      - 'tools/wire_remote_control.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply source wiring
        run: python3 tools/wire_remote_control.py
      - name: Commit migrated source
        run: |
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/app/router.dart lib/features/my_space/presentation/my_space_hub_screen.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Enforce remote routes and real Hub sign in'
          git push
