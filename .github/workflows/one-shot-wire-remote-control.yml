name: OTYA remote control wiring

on:
  push:
    paths:
      - '.github/workflows/one-shot-wire-remote-control.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply source wiring
        run: |
          python3 <<'PY'
          from pathlib import Path

          router = Path('lib/app/router.dart')
          s = router.read_text()
          anchor = "import '../core/widgets/update_dialog.dart';\n"
          remote_import = "import '../core/services/remote_control_service.dart';\n"
          if remote_import not in s:
              s = s.replace(anchor, anchor + remote_import)
          old = """  static String? _redirect(BuildContext context, GoRouterState state) {
    // Auth is optional — OTYA Player works fully offline without an account.
    // The auth screen is only reached by explicit navigation (e.g. from Profile).
    return null;
  }
"""
          new = """  static String? _redirect(BuildContext context, GoRouterState state) {
    final remote = RemoteControlService.instance;
    final feature = switch (state.matchedLocation) {
      '/airdrop' => 'beam',
      '/vault' => 'safe',
      '/player/equalizer' => 'equalizer',
      '/tools/whatsapp' => 'whatsappTrimmer',
      _ => null,
    };
    if (feature != null && !remote.featureEnabled(feature)) return '/myspace';
    return null;
  }
"""
          if old in s:
              s = s.replace(old, new)
          router.write_text(s)

          hub = Path('lib/features/my_space/presentation/my_space_hub_screen.dart')
          s = hub.read_text()
          s = s.replace("import 'package:uuid/uuid.dart';\n", '')
          s = s.replace(": () => _signIn(context, ref),", ": () => context.push('/auth'),")
          start = s.find('  Future<void> _signIn(BuildContext context, WidgetRef ref) async {')
          if start >= 0:
              end = s.find('  Future<void> _runBackup(', start)
              if end >= 0:
                  s = s[:start] + s[end:]
          hub.write_text(s)
          PY
      - name: Commit migrated source
        run: |
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/app/router.dart lib/features/my_space/presentation/my_space_hub_screen.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Enforce remote routes and real Hub sign in'
          git push
