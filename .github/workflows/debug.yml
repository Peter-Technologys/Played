# OTYA Player — CI
name: Debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/release.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/release.yml'
  workflow_dispatch:

concurrency:
  group: player-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.incremental=false"

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test

  verify-main-apk:
    name: Build and verify release APKs
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: development
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/share/swift || true
          sudo apt-get clean -y || true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Decode release keystore when available
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi
      - name: Flutter pub get
        run: flutter pub get
      - name: Build release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          GOOGLE_CLIENT_ID='82776565585-77b1t8epvmn3mpdvstdg1rtprlju4suv.apps.googleusercontent.com'
          BASE_URL="${WORKER_URL:-https://petersmartlink.com}"
          ARGS=(
            --release
            --split-per-abi
            --target-platform android-arm,android-arm64
            --dart-define=SELF_UPDATE=true
            --dart-define=WORKER_URL="$BASE_URL"
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
          )
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            ARGS+=(
              --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
              --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
              --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
              --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
            )
            echo "Firebase Messaging client configuration enabled."
          else
            echo "WARNING: Firebase client variables incomplete; APK will build with remote push disabled."
          fi
          flutter build apk "${ARGS[@]}"
      - name: Verify APKs and record checksums
        shell: bash
        run: |
          set -euo pipefail
          : > build/apk-sha256.txt
          for APK in build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            test -s "$APK"
            test "$(stat -c%s "$APK")" -ge 5000000
            sha256sum "$APK" | tee -a build/apk-sha256.txt
          done
      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
      - name: Remove secret material
        if: always()
        run: rm -f android/app/keystore.jks android/app/google-services.json
