# OTYA Player — Signed Release APK Build
#
# Builds a signed release APK on every push to main and on every pull request.
# APKs are split by ABI (arm64 + arm32) and uploaded as GitHub Actions artifacts.
# No R2 upload — use the Release workflow (push a v* tag) for that.
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Required GitHub Variables:
#   GOOGLE_SERVICES_JSON

name: Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot.github
  # -Xmx3g: leave headroom for the OS, Flutter SDK, and Android SDK on the
  # 7GB GitHub Actions runner. -Xmx4g caused OOM mid-build.
  # -XX:+UseG1GC: better GC pause behaviour for large heap builds.
  # org.gradle.caching=true: skip recompiling unchanged tasks on warm runs.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.incremental=false"

jobs:
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Free disk space (keep NDK — it is cached separately below) ────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          sudo apt-get clean -y || true
          df -h

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin to 3.32.x — Flutter stable 3.32+ contains the fix for the
          # "Already watching path" crash that occurs with AGP 9.x.
          # Using channel: stable alone picks up whatever stable is at run
          # time, which may be an older version without the patch.
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      # ── Cache Android NDK ──────────────────────────────────────────────
      # The NDK (~1.5 GB) was previously deleted by the free-disk-space step
      # and re-downloaded every run (3-4 min). Cache it keyed on the version
      # declared in android/app/build.gradle so a bump auto-busts the cache.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-28.2.13676358

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ hashFiles('pubspec.yaml') }}
            pub-

      # Cache Gradle wrapper, caches (including media_kit libmpv JARs), the
      # Gradle build cache, and the Android SDK CMake install.
      # Cache key includes gradle.properties and proguard-rules.pro so that
      # changes to R8/ProGuard config always produce a fresh build.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/
            ~/.gradle/caches/
            ~/.gradle/build-cache/
            /usr/local/lib/android/sdk/cmake/
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'pubspec.yaml', 'android/app/build.gradle', 'android/gradle.properties', 'android/app/proguard-rules.pro') }}
          restore-keys: |
            gradle-

      # ── Inject google-services.json ────────────────────────────────────
      # vars can be used in run scripts directly via ${{ vars.X }}
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "WARNING: GOOGLE_SERVICES_JSON not set — creating a placeholder."
            echo '{"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.otyaplayer.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
            echo "Release keystore decoded successfully."
          else
            echo "WARNING: KEYSTORE_BASE64 secret not set — generating debug keystore as fallback."
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi

      - name: Stop Gradle daemons
        run: cd android && ./gradlew --stop || true

      - name: Clean project
        run: |
          echo "Building commit: $(git rev-parse HEAD)"
          git log -1 --oneline
          rm -rf build .dart_tool android/.gradle android/app/build
          flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DD_SECRET: ${{ secrets.OTYA_SECRET }}
          DD_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          # Wipe all known APK output locations so the post-build existence
          # check can only find APKs produced by THIS run, not stale files.
          rm -rf build/app/outputs/flutter-apk
          rm -rf android/app/build/outputs/flutter-apk
          rm -rf android/app/build/outputs/apk/release

          flutter build apk --release --split-per-abi --verbose \
            --target-platform android-arm,android-arm64 \
            --dart-define=OTYA_SECRET=$DD_SECRET \
            --dart-define=APP_ARCH=arm64 \
            --dart-define=SELF_UPDATE=true \
            --dart-define=WORKER_URL=$DD_WORKER_URL
          BUILD_EXIT=$?

          # Flutter may exit 1 even when Gradle succeeded, because it looks
          # for APKs in build/app/outputs/flutter-apk/ (repo root) but AGP 8.x
          # places them under android/app/build/outputs/. Stage them first,
          # then only propagate the failure if APKs genuinely don't exist.
          #
          # Require BOTH ABI splits — a partial output is not acceptable.
          ARM64_A="android/app/build/outputs/flutter-apk/app-arm64-v8a-release.apk"
          ARM32_A="android/app/build/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          ARM64_B="android/app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          ARM32_B="android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk"

          if { [ -f "$ARM64_A" ] && [ -f "$ARM32_A" ]; } || \
             { [ -f "$ARM64_B" ] && [ -f "$ARM32_B" ]; }; then
            echo "Gradle produced both APK splits — staging to Flutter expected location."
            mkdir -p build/app/outputs/flutter-apk
            cp android/app/build/outputs/flutter-apk/*.apk \
               build/app/outputs/flutter-apk/ 2>/dev/null || true
            cp android/app/build/outputs/apk/release/*.apk \
               build/app/outputs/flutter-apk/ 2>/dev/null || true
            echo "Staged APKs:"
            ls -lh build/app/outputs/flutter-apk/
            exit 0
          fi

          # APKs missing or incomplete — Gradle itself failed.
          echo "ERROR: Expected both arm64 and arm32 APKs not found. Gradle build genuinely failed."
          echo "=== Gradle output dirs ==="
          find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "(none)"
          exit $BUILD_EXIT

      - name: Diagnose APK outputs
        if: always()
        run: |
          echo "=== Flutter APK output ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "(directory not found)"
          echo "=== All APKs under build/ ==="
          find build -type f -name "*.apk" -print 2>/dev/null || echo "(none)"
          echo "=== All APKs under android/app/build/ ==="
          find android/app/build/outputs -type f -name "*.apk" -print 2>/dev/null || echo "(none)"

      # Verify APKs exist and are not empty (fails if build was broken)
      - name: Verify APKs and record checksums
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            if [ ! -f "$APK" ]; then echo "ERROR: $APK not found"; exit 1; fi
            SIZE=$(stat -c%s "$APK")
            if [ "$SIZE" -lt 5000000 ]; then echo "ERROR: $APK too small ($SIZE bytes)"; exit 1; fi
            SHA=$(sha256sum "$APK" | cut -d' ' -f1)
            echo "OK: $APK | $SIZE bytes | sha256=$SHA"
          done

      - name: Remove secrets
        if: always()
        run: rm -f $GITHUB_WORKSPACE/android/app/keystore.jks android/app/google-services.json

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        if: success()
        run: |
          echo "### Release APK Built" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          ARM64=$(du -sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -f1)
          ARM32=$(du -sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | cut -f1)
          echo "**arm64:** $ARM64 | **arm32:** $ARM32" >> $GITHUB_STEP_SUMMARY

