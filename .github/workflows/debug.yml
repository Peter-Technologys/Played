# OTYA Player — Signed Release APK Build
#
# Builds a signed release APK on every push to main and on every pull request.
# APKs are split by ABI (arm64 + arm32) and uploaded as GitHub Actions artifacts.
# No R2 upload — use the Release workflow (push a v* tag) for that.
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Required GitHub Variables:
#   GOOGLE_SERVICES_JSON

name: Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g -Dkotlin.incremental=false"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Free disk space ────────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          sudo apt-get clean -y || true
          df -h

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      # ── Inject google-services.json ────────────────────────────────────
      # vars can be used in run scripts directly via ${{ vars.X }}
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "WARNING: GOOGLE_SERVICES_JSON not set — creating a placeholder."
            echo '{"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.otyaplayer.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ── Decode keystore (if available) ────────────────────────────────
      # secrets cannot be referenced in shell `if` via ${{ }} — pass via env instead
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/android/app/keystore.jks
          else
            echo "WARNING: KEYSTORE_BASE64 not set - APK will use debug signing."
          fi

      # ── Build release APK (signed, installable on any device) ──────────
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OTYA_SECRET: ${{ secrets.OTYA_SECRET }}
        run: |
          flutter build apk --release --no-pub --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define=OTYA_SECRET=$OTYA_SECRET \
            --dart-define=APP_ARCH=arm64 \
            --dart-define=SELF_UPDATE=true

      - name: Remove keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/android/app/keystore.jks

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### ✅ Release APK Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          ARM64_SIZE=$(du -sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null | cut -f1 || echo 'n/a')
          ARM32_SIZE=$(du -sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk 2>/dev/null | cut -f1 || echo 'n/a')
          echo "**arm64 APK size:** $ARM64_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**arm32 APK size:** $ARM32_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APKs from the Artifacts section above ↑" >> $GITHUB_STEP_SUMMARY

      # Telegram notifications are only sent from the Release workflow (v* tags).
      # Debug builds do not notify the channel.
