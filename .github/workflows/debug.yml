# OTYA Player — CI APK Build
name: Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.incremental=false"

jobs:
  build_debug:
    name: Build and verify APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get clean -y || true

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-28.2.13676358

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/
            ~/.gradle/caches/
            ~/.gradle/build-cache/
            /usr/local/lib/android/sdk/cmake/
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'pubspec.yaml', 'android/app/build.gradle', 'android/gradle.properties', 'android/app/proguard-rules.pro') }}
          restore-keys: |
            gradle-

      - name: Decode release keystore when available
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Build release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DD_SECRET: ${{ secrets.OTYA_SECRET }}
          DD_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -e
          # CI builds must use HTTPS and the production backend when configured.
          # Do not enable self-installing APK updates in the Play-distributed build.
          ARGS=(
            --release
            --split-per-abi
            --target-platform android-arm,android-arm64
            --dart-define=APP_ARCH=arm64
            --dart-define=SELF_UPDATE=false
          )
          if [ -n "$DD_WORKER_URL" ]; then
            ARGS+=(--dart-define=WORKER_URL="$DD_WORKER_URL")
          fi
          # Legacy signing secret is retained only for compatibility with any
          # endpoint that has not yet migrated; it is never used as an auth
          # credential for a user session.
          if [ -n "$DD_SECRET" ]; then
            ARGS+=(--dart-define=OTYA_SECRET="$DD_SECRET")
          fi
          flutter build apk "${ARGS[@]}"

      - name: Verify APKs and record checksums
        run: |
          set -e
          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            test -s "$APK"
            SIZE=$(stat -c%s "$APK")
            test "$SIZE" -ge 5000000
            echo "OK: $APK | $SIZE bytes | sha256=$(sha256sum "$APK" | cut -d' ' -f1)"
          done

      - name: Remove secrets
        if: always()
        run: rm -f android/app/keystore.jks android/app/google-services.json

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
          if-no-files-found: error
