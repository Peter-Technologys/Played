# OTYA Player — Signed Release APK Build
#
# Builds a signed release APK on every push to main and on every pull request.
# APKs are split by ABI (arm64 + arm32) and uploaded as GitHub Actions artifacts.
# No R2 upload — use the Release workflow (push a v* tag) for that.
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Required GitHub Variables:
#   GOOGLE_SERVICES_JSON

name: Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot.github
  # -Xmx3g: leave headroom for the OS, Flutter SDK, and Android SDK on the
  # 7GB GitHub Actions runner. -Xmx4g caused OOM mid-build.
  # -XX:+UseG1GC: better GC pause behaviour for large heap builds.
  # org.gradle.caching=true: skip recompiling unchanged tasks on warm runs.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.incremental=false -Dorg.gradle.caching=true"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Free disk space (keep NDK — it is cached separately below) ────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          sudo apt-get clean -y || true
          df -h

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin to 3.32.x — Flutter stable 3.32+ contains the fix for the
          # "Already watching path" crash that occurs with AGP 9.x.
          # Using channel: stable alone picks up whatever stable is at run
          # time, which may be an older version without the patch.
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      # ── Cache Android NDK ──────────────────────────────────────────────
      # The NDK (~1.5 GB) was previously deleted by the free-disk-space step
      # and re-downloaded every run (3-4 min). Cache it keyed on the version
      # declared in android/app/build.gradle so a bump auto-busts the cache.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-28.2.13676358

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ hashFiles('pubspec.yaml') }}
            pub-

      # Cache Gradle wrapper, caches (including media_kit libmpv JARs), the
      # Gradle build cache, and the Android SDK CMake install.
      # media_kit downloads ~200MB of libmpv JARs per ABI on every cold run —
      # caching them saves 3-4 minutes per build.
      # CMake (~50MB) is installed mid-build if missing, which can cause native
      # compilation to fail on constrained runners — caching it prevents that.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/
            ~/.gradle/caches/
            ~/.gradle/build-cache/
            /usr/local/lib/android/sdk/cmake/
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'pubspec.yaml', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-

      # ── Inject google-services.json ────────────────────────────────────
      # vars can be used in run scripts directly via ${{ vars.X }}
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "WARNING: GOOGLE_SERVICES_JSON not set — creating a placeholder."
            echo '{"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.otyaplayer.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Flutter pub get
        run: flutter pub get --no-precompile

      - name: Flutter analyze (non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ── Decode keystore (if available) ────────────────────────────────
      # secrets cannot be referenced in shell `if` via ${{ }} — pass via env instead
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/android/app/keystore.jks
          else
            echo "WARNING: KEYSTORE_BASE64 not set - APK will use debug signing."
          fi

      # ── Pre-build diagnostics ──────────────────────────────────────
      - name: Pre-build diagnostics
        run: |
          df -h
          ls /usr/local/lib/android/sdk/cmake/ || echo "CMake not cached — will be downloaded"

      # ── Generate Flutter build files ───────────────────────────────
      # flutter build apk with AGP 8.7.3 + Gradle 8.10.2 triggers a known
      # "Already watching path" watcher crash that causes Flutter's output
      # path resolver to fail even though Gradle produces the APKs correctly.
      # Fix: run `flutter build apk` with --analyze-size=false just to
      # generate local.properties and the Flutter Gradle plugin inputs, then
      # let it fail, and invoke Gradle's assembleRelease directly.
      # Gradle always writes APKs to android/app/build/outputs/apk/release/.
      - name: Generate Flutter Gradle inputs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DD_SECRET: ${{ secrets.OTYA_SECRET }}
          DD_ARCH: arm64
          DD_UPDATE: "true"
          DD_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          # Write local.properties so Gradle knows the Flutter SDK path.
          echo "flutter.sdk=$(flutter --version --machine | python3 -c "import sys,json; print(json.load(sys.stdin).get('flutterRoot',''))" 2>/dev/null || flutter --version 2>&1 | head -1)" || true
          FLUTTER_ROOT=$(flutter --version --machine 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('flutterRoot',''))" 2>/dev/null)
          if [ -z "$FLUTTER_ROOT" ]; then
            FLUTTER_ROOT=$(which flutter | xargs readlink -f | sed 's|/bin/flutter||')
          fi
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          echo "Written android/local.properties:"
          cat android/local.properties

      # ── Build release APK via Gradle directly ──────────────────────
      # Bypasses Flutter's broken output watcher (AGP 8.7.3 + Gradle 8.10.2
      # "Already watching path" bug). Gradle writes APKs to:
      #   android/app/build/outputs/apk/release/
      # We copy them to the standard flutter-apk path afterwards.
      - name: Build release APK (Gradle direct)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DD_SECRET: ${{ secrets.OTYA_SECRET }}
          DD_ARCH: arm64
          DD_UPDATE: "true"
          DD_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pdart-defines="$(echo -n "OTYA_SECRET=$DD_SECRET,APP_ARCH=$DD_ARCH,SELF_UPDATE=$DD_UPDATE,WORKER_URL=$DD_WORKER_URL" | base64 -w 0)" \
            -Ptarget-platform=android-arm,android-arm64 \
            -Psplit-per-abi=true \
            --stacktrace

      # ── Post-build diagnostics (always runs) ───────────────────────
      - name: Post-build diagnostics
        if: always()
        run: |
          echo "=== Disk usage ==="
          df -h
          echo "=== APKs found in android/app/build/ ==="
          find android/app/build/ -name '*.apk' 2>/dev/null || echo "(none)"
          echo "=== APKs found in build/ ==="
          find build/ -name '*.apk' 2>/dev/null || echo "(none)"

      # Gradle (invoked directly) writes APKs to android/app/build/outputs/apk/release/.
      # Copy them to the conventional flutter-apk path so the upload step works unchanged.
      - name: Locate and verify APKs
        run: |
          GRADLE_OUT="android/app/build/outputs/apk/release"
          OUTDIR="build/app/outputs/flutter-apk"
          mkdir -p "$OUTDIR"

          echo "=== Gradle APK output dir ==="
          ls -lh "$GRADLE_OUT/" 2>/dev/null || echo "(empty or missing)"

          # Copy arm64 and arm32 release APKs to the expected output path
          for ABI in arm64-v8a armeabi-v7a; do
            SRC="$GRADLE_OUT/app-${ABI}-release.apk"
            DST="$OUTDIR/app-${ABI}-release.apk"
            if [ -f "$SRC" ]; then
              cp -v "$SRC" "$DST"
            else
              echo "WARNING: $SRC not found — searching entire build tree"
              FOUND=$(find . -name "app-${ABI}-release.apk" 2>/dev/null | head -1)
              if [ -n "$FOUND" ]; then
                cp -v "$FOUND" "$DST"
              fi
            fi
          done

          echo "=== Contents of $OUTDIR ==="
          ls -lh "$OUTDIR/" 2>/dev/null || echo "(empty)"

          # Verify the two required ABI APKs exist
          MISSING=0
          for APK in \
            "$OUTDIR/app-arm64-v8a-release.apk" \
            "$OUTDIR/app-armeabi-v7a-release.apk"; do
            if [ -f "$APK" ]; then
              echo "OK: $APK ($(du -sh "$APK" | cut -f1))"
            else
              echo "MISSING: $APK"
              MISSING=1
            fi
          done
          [ $MISSING -eq 0 ] || exit 1

      - name: Remove keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/android/app/keystore.jks

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### ✅ Release APK Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          ARM64_SIZE=$(du -sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null | cut -f1 || echo 'n/a')
          ARM32_SIZE=$(du -sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk 2>/dev/null | cut -f1 || echo 'n/a')
          echo "**arm64 APK size:** $ARM64_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**arm32 APK size:** $ARM32_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APKs from the Artifacts section above ↑" >> $GITHUB_STEP_SUMMARY

      # Telegram notifications are only sent from the Release workflow (v* tags).
      # Debug builds do not notify the channel.
