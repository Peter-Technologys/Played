# OTYA Player — Signed Release APK Build
#
# Builds a signed release APK on every push to main and on every pull request.
# APKs are split by ABI (arm64 + arm32) and uploaded as GitHub Actions artifacts.
# No R2 upload — use the Release workflow (push a v* tag) for that.
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Required GitHub Variables:
#   GOOGLE_SERVICES_JSON

name: Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot.github
  # -Xmx3g: leave headroom for the OS, Flutter SDK, and Android SDK on the
  # 7GB GitHub Actions runner. -Xmx4g caused OOM mid-build.
  # -XX:+UseG1GC: better GC pause behaviour for large heap builds.
  # org.gradle.caching=true: skip recompiling unchanged tasks on warm runs.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.incremental=false -Dorg.gradle.caching=true"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Free disk space (keep NDK — it is cached separately below) ────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          sudo apt-get clean -y || true
          df -h

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin to 3.32.x — Flutter stable 3.32+ contains the fix for the
          # "Already watching path" crash that occurs with AGP 9.x.
          # Using channel: stable alone picks up whatever stable is at run
          # time, which may be an older version without the patch.
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      # ── Cache Android NDK ──────────────────────────────────────────────
      # The NDK (~1.5 GB) was previously deleted by the free-disk-space step
      # and re-downloaded every run (3-4 min). Cache it keyed on the version
      # declared in android/app/build.gradle so a bump auto-busts the cache.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-28.2.13676358

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ hashFiles('pubspec.yaml') }}
            pub-

      # Cache Gradle wrapper, caches (including media_kit libmpv JARs), and
      # the Gradle build cache. media_kit downloads ~200MB of libmpv JARs per
      # ABI on every cold run — caching them saves 3-4 minutes per build.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/
            ~/.gradle/caches/
            ~/.gradle/build-cache/
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'pubspec.yaml') }}
          restore-keys: |
            gradle-

      # ── Inject google-services.json ────────────────────────────────────
      # vars can be used in run scripts directly via ${{ vars.X }}
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "WARNING: GOOGLE_SERVICES_JSON not set — creating a placeholder."
            echo '{"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.otyaplayer.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Flutter pub get
        run: flutter pub get --no-precompile

      - name: Flutter analyze (non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ── Decode keystore (if available) ────────────────────────────────
      # secrets cannot be referenced in shell `if` via ${{ }} — pass via env instead
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/android/app/keystore.jks
          else
            echo "WARNING: KEYSTORE_BASE64 not set - APK will use debug signing."
          fi

      # ── Write local.properties so Gradle knows the Flutter SDK path ────
      - name: Write local.properties
        run: |
          FLUTTER_SDK=$(flutter sdk-path 2>/dev/null || dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      # ── Build Dart kernel (flutter assemble) ─────────────────────────
      # Run flutter assemble to compile Dart → kernel + AOT snapshot.
      # This is what flutter build apk does internally before invoking Gradle.
      # Running it separately avoids the file-watcher crash entirely.
      - name: Flutter assemble (Dart → AOT snapshot)
        env:
          DD_SECRET: ${{ secrets.OTYA_SECRET }}
          DD_ARCH: arm64
          DD_UPDATE: "true"
          DD_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          flutter assemble \
            --output=build/ \
            -dTargetPlatform=android-arm64 \
            -dBuildMode=release \
            -dDartObfuscation=false \
            -dSplitDebugInfo= \
            --DartDefines="$(echo -n "OTYA_SECRET=$DD_SECRET,APP_ARCH=$DD_ARCH,SELF_UPDATE=$DD_UPDATE,WORKER_URL=$DD_WORKER_URL" | base64 -w0)" \
            release_android_application || true
          flutter assemble \
            --output=build/ \
            -dTargetPlatform=android-arm \
            -dBuildMode=release \
            -dDartObfuscation=false \
            -dSplitDebugInfo= \
            --DartDefines="$(echo -n "OTYA_SECRET=$DD_SECRET,APP_ARCH=$DD_ARCH,SELF_UPDATE=$DD_UPDATE,WORKER_URL=$DD_WORKER_URL" | base64 -w0)" \
            release_android_application || true

      # ── Build release APK via Gradle directly ──────────────────────
      # Invoke assembleRelease directly, bypassing flutter build apk and its
      # file-watcher layer. Dart defines are passed as Gradle project properties.
      - name: Build release APK (Gradle direct)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DD_SECRET: ${{ secrets.OTYA_SECRET }}
          DD_ARCH: arm64
          DD_UPDATE: "true"
          DD_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pdart-defines="$(echo -n "OTYA_SECRET=$DD_SECRET,APP_ARCH=$DD_ARCH,SELF_UPDATE=$DD_UPDATE,WORKER_URL=$DD_WORKER_URL" | base64 -w0)" \
            --stacktrace

      # Verify APKs were actually produced. Fail here with a clear message
      # if Gradle itself failed (as opposed to just the Flutter watcher crash).
      - name: Verify APKs produced
        run: |
          MISSING=0
          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            if [ -f "$APK" ]; then
              echo "OK: $APK ($(du -sh "$APK" | cut -f1))"
            else
              echo "MISSING: $APK"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "--- All APKs found in build/ ---"
            find build/ -name '*.apk' 2>/dev/null || echo "(none)"
            exit 1
          fi

      - name: Remove keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/android/app/keystore.jks

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### ✅ Release APK Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          ARM64_SIZE=$(du -sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null | cut -f1 || echo 'n/a')
          ARM32_SIZE=$(du -sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk 2>/dev/null | cut -f1 || echo 'n/a')
          echo "**arm64 APK size:** $ARM64_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**arm32 APK size:** $ARM32_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APKs from the Artifacts section above ↑" >> $GITHUB_STEP_SUMMARY

      # Telegram notifications are only sent from the Release workflow (v* tags).
      # Debug builds do not notify the channel.
