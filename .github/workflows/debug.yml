# OTYA Player — CI APK Build
name: Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.incremental=false"

jobs:
  build_debug:
    name: Analyze, test, build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/share/swift || true
          sudo apt-get clean -y || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply one-time library and Beam cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          from pathlib import Path

          video = Path('lib/features/video/presentation/video_tab_screen.dart')
          s = video.read_text()
          s = s.replace(
              "// ── List / Grid toggle — true = list view (default), false = grid view ────\n\nfinal _videoListViewProvider = StateProvider<bool>((_) => true);\n\n",
              "")
          s = s.replace(
              "        final isListView = ref.watch(_videoListViewProvider);\n        return _VideoGrid(items: videos, isListView: isListView);",
              "        return _VideoGrid(items: videos, isListView: true);")
          s = s.replace("""          const SizedBox(width: 6),
          // List / Grid toggle
          _IconBtn(
            icon: ref.watch(_videoListViewProvider)
                ? Icons.grid_view_rounded
                : Icons.view_list_rounded,
            onTap: () {
              HapticFeedback.selectionClick();
              ref.read(_videoListViewProvider.notifier).state =
                  !ref.read(_videoListViewProvider);
            },
          ),
""", "")
          video.write_text(s)

          beam = Path('lib/features/air_drop/presentation/air_drop_screen.dart')
          s = beam.read_text()
          s = s.replace("""      final fileName = url.split('/').last.contains('.')
          ? url.split('/').last
          : 'received_${DateTime.now().millisecondsSinceEpoch}.mp4';
""", """      final transferUri = Uri.parse(url);
      final advertisedName = transferUri.queryParameters['name'];
      final cleanedName = advertisedName
          ?.replaceAll('\\\\', '/')
          .split('/')
          .last
          .trim();
      final fileName = (cleanedName != null && cleanedName.isNotEmpty)
          ? cleanedName
          : 'received_${DateTime.now().millisecondsSinceEpoch}.bin';
""")
          s = s.replace("""  Future<void> onQrScanned(String url) async {
    if (state.receiveStep == _ReceiveStep.downloading) return;
""", """  Future<void> onQrScanned(String url) async {
    if (state.receiveStep == _ReceiveStep.downloading) return;
    final uri = Uri.tryParse(url);
    final host = uri?.host ?? '';
    if (uri == null || uri.scheme != 'http' || !_isPrivateHost(host)) {
      state = state.copyWith(
        receiveStep: _ReceiveStep.error,
        errorMessage: 'Beam only accepts links from a nearby device on your local Wi-Fi or hotspot.',
      );
      _log('Rejected non-local Beam link.');
      return;
    }
""")
          s = s.replace("""  void cancelDownload() { _receiver.cancel(); resetReceive(); _log('Cancelled.'); }

  @override
""", """  void cancelDownload() { _receiver.cancel(); resetReceive(); _log('Cancelled.'); }

  bool _isPrivateHost(String host) {
    final parts = host.split('.');
    if (parts.length != 4) return false;
    final nums = parts.map(int.tryParse).toList();
    if (nums.any((n) => n == null)) return false;
    final a = nums[0]!;
    final b = nums[1]!;
    return a == 10 ||
        (a == 192 && b == 168) ||
        (a == 172 && b >= 16 && b <= 31);
  }

  @override
""")
          s = s.replace("""        Expanded(
          child: ClipRRect(
            borderRadius: BorderRadius.circular(20),
            child: MobileScanner(
              controller: scanCtrl,
              onDetect: (BarcodeCapture capture) {
                if (scanned) return;
                final barcode = capture.barcodes.firstOrNull;
                final url = barcode?.displayValue ?? barcode?.rawValue;
                if (url != null && url.startsWith('http')) {
                  scanned = true;
                  HapticFeedback.mediumImpact();
                  n.onQrScanned(url);
                }
              },
            ),
          ),
        ),
""", """        Center(
          child: SizedBox(
            width: 260,
            height: 260,
            child: ClipRRect(
              borderRadius: BorderRadius.circular(20),
              child: MobileScanner(
                controller: scanCtrl,
                fit: BoxFit.cover,
                onDetect: (BarcodeCapture capture) {
                  if (scanned) return;
                  final barcode = capture.barcodes.firstOrNull;
                  final url = barcode?.displayValue ?? barcode?.rawValue;
                  if (url != null && url.startsWith('http://')) {
                    scanned = true;
                    HapticFeedback.mediumImpact();
                    n.onQrScanned(url);
                  }
                },
              ),
            ),
          ),
        ),
""")
          s = s.replace("indicator: BoxDecoration(\n                    gradient: AppColors.accentGradient,\n                    borderRadius: BorderRadius.circular(12)),",
                        "indicator: BoxDecoration(\n                    color: AppColors.accent,\n                    borderRadius: BorderRadius.circular(12)),")
          s = s.replace('labelColor: Colors.black,', 'labelColor: Colors.white,')
          s = s.replace("tabs: const [Tab(text: '📤  Beam'), Tab(text: '📥  Catch')],",
                        "tabs: const [Tab(text: 'Send'), Tab(text: 'Receive')],")
          s = s.replace("Text('🎥 ${state.selectedItem!.title}  •  ${state.selectedItem!.formattedSize}',",
                        "Text('${state.selectedItem!.title}  •  ${state.selectedItem!.formattedSize}',")
          s = s.replace("const Text('File received! ✔',", "const Text('File received',")
          s = s.replace("const Text('Added to your media library.',", "const Text('Saved on this device.',")
          beam.write_text(s)

          router = Path('lib/app/router.dart')
          s = router.read_text().replace(
              "url: args['url'] as String? ?? 'https://getotya.petersmartlink.com',",
              "url: args['url'] as String? ?? 'https://petersmartlink.com/otya-player',")
          router.write_text(s)

          profile = Path('lib/features/profile/profile_screen.dart')
          s = profile.read_text()
          s = s.replace("subtitle: 'getotya.petersmartlink.com',",
                        "subtitle: 'petersmartlink.com/otya-player',")
          s = s.replace("'url': 'https://getotya.petersmartlink.com',",
                        "'url': 'https://petersmartlink.com/otya-player',")
          profile.write_text(s)

      - name: Commit one-time cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-library-beam-cleanup.yml
          if git diff --quiet; then exit 0; fi
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/video/presentation/video_tab_screen.dart \
                  lib/features/air_drop/presentation/air_drop_screen.dart \
                  lib/app/router.dart \
                  lib/features/profile/profile_screen.dart \
                  .github/workflows/one-shot-library-beam-cleanup.yml
          git commit -m 'Simplify video library and repair OTYA Beam transfer'
          git push

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode release keystore when available
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Static analysis
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee build/flutter-analyze.log

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-${{ github.sha }}
          path: build/flutter-analyze.log
          retention-days: 14
          if-no-files-found: warn

      - name: Unit and widget tests
        run: flutter test --coverage

      - name: Build release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --release
            --split-per-abi
            --target-platform android-arm,android-arm64
            --dart-define=SELF_UPDATE=false
          )
          if [ -n "${{ secrets.WORKER_URL }}" ]; then
            ARGS+=(--dart-define=WORKER_URL="${{ secrets.WORKER_URL }}")
          fi
          flutter build apk "${ARGS[@]}"

      - name: Verify APKs and record checksums
        shell: bash
        run: |
          set -euo pipefail
          : > build/apk-sha256.txt
          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            test -s "$APK"
            SIZE=$(stat -c%s "$APK")
            test "$SIZE" -ge 5000000
            sha256sum "$APK" | tee -a build/apk-sha256.txt
          done

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/apk-sha256.txt
          retention-days: 14
          if-no-files-found: error

      - name: Remove secret material
        if: always()
        run: rm -f android/app/keystore.jks android/app/google-services.json
