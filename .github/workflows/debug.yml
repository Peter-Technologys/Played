# OTYA Player — CI
name: Debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/release.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/release.yml'
  workflow_dispatch:

concurrency:
  group: player-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.incremental=false"

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate OTYA launcher icons
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test

  verify-main-apk:
    name: Build and verify release APKs
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/share/swift || true
          sudo apt-get clean -y || true
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare signing mode
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "OTYA_ALLOW_DEBUG_SIGNING=false" >> "$GITHUB_ENV"
            echo "OTYA_SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "Production signing material is available for this CI artifact."
          else
            echo "OTYA_ALLOW_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "OTYA_SIGNING_MODE=ci-debug" >> "$GITHUB_ENV"
            echo "NOTICE: No production keystore secret is available. This CI artifact is debug-signed and must not be published."
          fi
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate OTYA launcher icons
        run: dart run flutter_launcher_icons
      - name: Build release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          GOOGLE_WEB_CLIENT_ID='82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com'
          FIREBASE_APP_ID='1:82776565585:android:085cf9b4eecb76e9535570'
          FIREBASE_MESSAGING_SENDER_ID='82776565585'
          FIREBASE_PROJECT_ID='otya-player'
          BASE_URL="${WORKER_URL:-https://petersmartlink.com}"
          ARGS=(
            --release
            --split-per-abi
            --target-platform android-arm,android-arm64
            --dart-define=SELF_UPDATE=false
            --dart-define=WORKER_URL="$BASE_URL"
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          )
          if [ -n "$FIREBASE_API_KEY" ]; then
            ARGS+=(
              --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
              --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
              --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
              --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
            )
            echo "Firebase client configuration enabled for verified OTYA project."
          else
            echo "NOTICE: FIREBASE_API_KEY is missing; APK will build with remote Firebase services disabled."
          fi
          flutter build apk "${ARGS[@]}"
      - name: Verify APKs, size budget and checksums
        env:
          MAX_SPLIT_APK_MB: ${{ vars.MAX_SPLIT_APK_MB }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_MB="${MAX_SPLIT_APK_MB:-80}"
          MAX_BYTES=$((MAX_MB * 1024 * 1024))
          : > build/apk-sha256.txt
          : > build/apk-size.txt
          echo "### OTYA split APK verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing mode: **${OTYA_SIGNING_MODE:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${OTYA_SIGNING_MODE:-}" = "ci-debug" ]; then
            echo "> This is a CI validation artifact only. Do not publish it." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| ABI | Size | Budget |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"
          for APK in build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            test -s "$APK"
            BYTES="$(stat -c%s "$APK")"
            test "$BYTES" -ge 5000000
            if [ "$BYTES" -gt "$MAX_BYTES" ]; then
              echo "ERROR: $APK is $BYTES bytes; split APK budget is ${MAX_MB} MiB." >&2
              exit 1
            fi
            ABI="$(basename "$APK" | sed -e 's/app-//' -e 's/-release.apk//')"
            MIB="$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b/1048576 }')"
            printf '%s\t%s bytes\t%s MiB\n' "$ABI" "$BYTES" "$MIB" | tee -a build/apk-size.txt
            echo "| $ABI | ${MIB} MiB | ${MAX_MB} MiB |" >> "$GITHUB_STEP_SUMMARY"
            sha256sum "$APK" | tee -a build/apk-sha256.txt
          done
      - name: Upload APKs and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/apk-sha256.txt
            build/apk-size.txt
          retention-days: 7
          if-no-files-found: error
      - name: Remove secret material
        if: always()
        run: rm -f android/app/keystore.jks android/app/google-services.json
