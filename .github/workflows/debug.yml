# OTYA Player — Signed Release APK Build
# Builds signed release APKs on every push to main and on every pull request.
# Each ABI is built separately to avoid Flutter split-APK output detection failures.

name: Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot.github
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dkotlin.incremental=false"

jobs:
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          sudo apt-get clean -y || true
          df -h

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-28.2.13676358

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ hashFiles('pubspec.yaml') }}
            pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/
            ~/.gradle/caches/
            ~/.gradle/build-cache/
            /usr/local/lib/android/sdk/cmake/
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'pubspec.yaml', 'android/app/build.gradle', 'android/gradle.properties', 'android/app/proguard-rules.pro') }}
          restore-keys: |
            gradle-

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
            echo "Release keystore decoded successfully."
          else
            echo "WARNING: KEYSTORE_BASE64 secret not set — generating debug keystore as fallback."
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi

      - name: Stop Gradle daemons
        run: cd android && ./gradlew --stop || true

      - name: Clean project
        run: |
          echo "Building commit: $(git rev-parse HEAD)"
          git log -1 --oneline
          rm -rf build .dart_tool android/.gradle android/app/build
          flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze Dart code
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings
          ANALYZE_EXIT=$?
          set -e
          if [ "$ANALYZE_EXIT" -ne 0 ]; then
            echo "Analyzer reported issues; continuing to the compiler/build gate."
            echo "Compilation errors remain blocking because the release build itself must succeed."
          fi
          exit 0

      - name: Build arm64 APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DD_SECRET: ${{ secrets.OTYA_SECRET }}
          DD_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -e
          rm -rf build/app/outputs/flutter-apk
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=OTYA_SECRET="$DD_SECRET" \
            --dart-define=SELF_UPDATE=true \
            --dart-define=WORKER_URL="$DD_WORKER_URL"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build arm32 APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DD_SECRET: ${{ secrets.OTYA_SECRET }}
          DD_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -e
          rm -rf build/app/outputs/flutter-apk
          flutter build apk --release --target-platform android-arm \
            --dart-define=OTYA_SECRET="$DD_SECRET" \
            --dart-define=SELF_UPDATE=true \
            --dart-define=WORKER_URL="$DD_WORKER_URL"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/app-armeabi-v7a-release.apk

      - name: Restore APK output directory
        run: |
          mkdir -p build/app/outputs/flutter-apk
          cp /tmp/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Verify APKs and record checksums
        run: |
          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
            test -f "$APK" || { echo "ERROR: $APK not found"; exit 1; }
            SIZE=$(stat -c%s "$APK")
            test "$SIZE" -gt 5000000 || { echo "ERROR: $APK too small ($SIZE bytes)"; exit 1; }
            SHA=$(sha256sum "$APK" | cut -d' ' -f1)
            echo "OK: $APK | $SIZE bytes | sha256=$SHA"
          done

      - name: Diagnose APK outputs
        if: always()
        run: |
          echo "=== APKs under build/ ==="
          find build -type f -name "*.apk" -print 2>/dev/null || true
          echo "=== APKs under android/app/build/ ==="
          find android/app/build -type f -name "*.apk" -print 2>/dev/null || true

      - name: Remove secrets
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/android/app/keystore.jks" android/app/google-services.json

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: otya-player-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        if: success()
        run: |
          echo "### Release APK Built" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
