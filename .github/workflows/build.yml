# ───────────────────────────────────────────────────────────────
# OTYA Player — GitHub Actions
#
# Job summary:
#   analyze        — flutter analyze        (every PR + main push)
#   unit_test      — flutter test           (PR only)
#   build_debug    — debug APK              (PR only)
#   build_release  — signed AAB + APKs +
#                    universal APK +
#                    Firebase distribution  (version tags only: v1.x.x)
#
# To release: create a tag in GitLab (mirrors to GitHub automatically)
#   e.g. tag name: v1.2.1
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
#   KEYSTORE_BASE64           — base64-encoded .jks keystore
#   STORE_PASSWORD            — keystore password
#   KEY_ALIAS                 — key alias
#   KEY_PASSWORD              — key password
#   FIREBASE_APP_ID           — Firebase App ID (optional)
#   FIREBASE_SERVICE_ACCOUNT  — Firebase service account JSON (optional)
#
# Required GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#   GOOGLE_SERVICES_JSON      — raw contents of google-services.json
#   FIREBASE_TESTERS          — comma-separated tester emails (optional)
#   FIREBASE_ENABLED          — set to 'true' to enable Firebase distribution
# ───────────────────────────────────────────────────────────────

name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

# Concurrency only cancels duplicate runs on the same ref.
# Tags get their own unique group so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PUB_ENVIRONMENT: bot.github

jobs:

  # ── ANALYZE — every PR and main push ───────────────────────────────────────────
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ── UNIT TESTS — PR only ───────────────────────────────────────────────────────────
  unit_test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-
      - run: flutter pub get
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── DEBUG APK — PR and main push ──────────────────────────────────────────────────
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-
      - run: flutter pub get
      - name: Write google-services.json
        run: |
          if [ -n "${{ vars.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo '{"project_info":{"project_id":"placeholder"},"client":[]}' > android/app/google-services.json
          fi
      - run: flutter build apk --debug
      - name: Remove google-services.json
        if: always()
        run: rm -f android/app/google-services.json
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  # ── RELEASE — version tags only (v*) ───────────────────────────────────────────
  build_release:
    name: Build Signed Release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - run: flutter pub get

      - name: Write google-services.json
        run: echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # ── AAB (Play Store) ───────────────────────────────────────────────────────────
      - name: Build release AAB
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ── Split APKs (arm64 + arm32) ──────────────────────────────────────────────────
      - name: Build split APKs
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ── Universal APK (share via Bluetooth / WhatsApp / Drive) ───────────────
      - name: Build universal APK
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/otya-player-${{ github.ref_name }}-universal.apk

      - name: Remove secrets
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/app/google-services.json

      # ── Upload artifacts ──────────────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info/
          retention-days: 7

      # ── GitHub Release ──────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/otya-player-${{ github.ref_name }}-universal.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      # ── Firebase App Distribution (optional) ─────────────────────────────────
      - name: Distribute to testers via Firebase
        if: vars.FIREBASE_ENABLED == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/otya-player-${{ github.ref_name }}-universal.apk
          releaseNotes: |
            OTYA Player ${{ github.ref_name }}
          testers: ${{ vars.FIREBASE_TESTERS }}
