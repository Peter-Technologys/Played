# ───────────────────────────────────────────────────────────────
# OTYA Player — GitHub Actions
#
# Triggers on version tags (e.g. v1.2.1):
#   - Builds signed split APKs (arm64 + arm32)
#   - Uploads APKs to Cloudflare R2
#   - Creates a GitHub Release
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64      — base64-encoded .jks keystore
#   STORE_PASSWORD       — keystore password
#   KEY_ALIAS            — key alias
#   KEY_PASSWORD         — key password
#   R2_ACCESS_KEY_ID     — Cloudflare R2 access key ID
#   R2_SECRET_ACCESS_KEY — Cloudflare R2 secret access key
#   R2_BUCKET            — R2 bucket name
#   R2_ENDPOINT          — https://<account_id>.r2.cloudflarestorage.com
#
# Required GitHub Variables:
#   GOOGLE_SERVICES_JSON — raw contents of google-services.json
# ───────────────────────────────────────────────────────────────

name: Build & Test

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PUB_ENVIRONMENT: bot.github

jobs:

  build_release:
    name: Build Signed Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - run: flutter pub get

      - name: Write google-services.json
        run: echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build split APKs
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Remove secrets
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/app/google-services.json

      - name: Upload APKs to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install awscli --quiet
          TAG=${{ github.ref_name }}
          aws s3 cp \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            s3://$R2_BUCKET/releases/$TAG/otya-player-$TAG-arm64.apk \
            --endpoint-url $R2_ENDPOINT
          aws s3 cp \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            s3://$R2_BUCKET/releases/$TAG/otya-player-$TAG-arm32.apk \
            --endpoint-url $R2_ENDPOINT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
