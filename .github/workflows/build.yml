# ───────────────────────────────────────────────────────────────
# OTYA Player — GitHub Actions
#
# Job summary:
#   analyze        — flutter analyze (every PR + main push)
#   unit_test      — flutter test    (PR only)
#   build_debug    — debug APK       (PR only, needs analyze)
#   build_release  — signed AAB + split APKs (version tags only: v1.2.3)
#
# To release: git tag v1.2.3 && git push origin v1.2.3
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64      — base64-encoded .jks keystore
#   STORE_PASSWORD       — keystore password
#   KEY_ALIAS            — key alias
#   KEY_PASSWORD         — key password
#
# Required GitHub variables (Settings → Secrets and variables → Variables):
#   GOOGLE_SERVICES_JSON — raw contents of google-services.json
# ───────────────────────────────────────────────────────────────

name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

# Cancel in-progress runs on the same ref to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: bot.github

# ───────────────────────────────────────────────────────────────
jobs:

  # ── ANALYZE — every PR and main push ───────────────────────────────────────────
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ── UNIT TESTS — PR only ────────────────────────────────────────────────────────────
  unit_test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - run: flutter pub get
      - run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── DEBUG APK — PR only ──────────────────────────────────────────────────────────────
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - run: flutter pub get

      - name: Write google-services.json
        run: |
          if [ -n "${{ vars.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo '{"project_info":{"project_id":"placeholder"},"client":[]}' > android/app/google-services.json
          fi

      - run: flutter build apk --debug

      - name: Remove google-services.json
        if: always()
        run: rm -f android/app/google-services.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  # ── RELEASE — version tags only (v1.2.3) ──────────────────────────────────────────
  build_release:
    name: Build Signed Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-

      - run: flutter pub get

      - name: Write google-services.json
        run: echo '${{ vars.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build release AAB
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Build release APKs (split by ABI)
        env:
          KEYSTORE_PATH: keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Remove secrets
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/app/google-services.json

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info/
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true
