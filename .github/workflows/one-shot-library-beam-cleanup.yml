name: One-shot library and Beam cleanup

on:
  push:
    paths:
      - .github/workflows/one-shot-library-beam-cleanup.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply source migration
        run: echo '' | base64 -d | python3
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/video/presentation/video_tab_screen.dart lib/features/air_drop/presentation/air_drop_screen.dart lib/app/router.dart lib/features/profile/profile_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Simplify video library and repair OTYA Beam transfer'
          git push
