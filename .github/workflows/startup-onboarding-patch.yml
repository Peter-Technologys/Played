name: One-shot startup and onboarding stabilization

on:
  push:
    branches: [v1-rebuild]
    paths:
      - '.github/workflows/startup-onboarding-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true
      - name: Apply startup and onboarding fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} match(es), found {actual}')
              p.write_text(text.replace(old, new, count))

          onboarding = '''import 'package:flutter/material.dart';
import 'package:shared_preferences/shared_preferences.dart';

import '../../app/theme/app_dimensions.dart';
import '../../shared/widgets/otya_logo.dart';

class OnboardingOverlay extends StatefulWidget {
  const OnboardingOverlay({super.key, required this.onDone});

  final VoidCallback onDone;

  @override
  State<OnboardingOverlay> createState() => _OnboardingOverlayState();
}

class _OnboardingOverlayState extends State<OnboardingOverlay> {
  bool _busy = false;

  Future<void> _finish() async {
    if (_busy) return;
    setState(() => _busy = true);
    try {
      final prefs = await SharedPreferences.getInstance();
      await prefs.setBool('isFirstLaunch', false);
      await prefs.setBool('onboarding_done', true);
    } catch (_) {}
    if (mounted) widget.onDone();
  }

  @override
  Widget build(BuildContext context) {
    final theme = Theme.of(context);
    final scheme = theme.colorScheme;

    return Material(
      color: theme.scaffoldBackgroundColor,
      child: SafeArea(
        child: Padding(
          padding: const EdgeInsets.fromLTRB(24, 20, 24, 24),
          child: Center(
            child: ConstrainedBox(
              constraints: const BoxConstraints(maxWidth: 560),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const OtyaLogo(
                    fontSize: 22,
                    padding: EdgeInsets.symmetric(horizontal: 11, vertical: 8),
                  ),
                  const Spacer(),
                  Container(
                    width: 82,
                    height: 82,
                    decoration: BoxDecoration(
                      color: scheme.primary.withValues(alpha: .12),
                      borderRadius: BorderRadius.circular(
                        AppDimensions.radiusXLarge,
                      ),
                    ),
                    child: Icon(
                      Icons.play_circle_outline_rounded,
                      size: 40,
                      color: scheme.primary,
                    ),
                  ),
                  const SizedBox(height: 30),
                  Text(
                    'Welcome to OTYA',
                    style: theme.textTheme.headlineMedium?.copyWith(
                      fontWeight: FontWeight.w900,
                      letterSpacing: -.8,
                      height: 1.08,
                    ),
                  ),
                  const SizedBox(height: 14),
                  Text(
                    'Your videos, music and useful media tools in one private, offline-first Android app.',
                    style: theme.textTheme.bodyLarge?.copyWith(
                      color: scheme.onSurfaceVariant,
                      height: 1.55,
                    ),
                  ),
                  const SizedBox(height: 24),
                  _WelcomePoint(
                    icon: Icons.video_library_outlined,
                    text: 'Video and Music stay local and easy to find.',
                  ),
                  _WelcomePoint(
                    icon: Icons.wifi_tethering_rounded,
                    text: 'Transfer works directly over local Wi-Fi or hotspot.',
                  ),
                  _WelcomePoint(
                    icon: Icons.lock_outline_rounded,
                    text: 'Private and App Lock help protect what matters.',
                  ),
                  const Spacer(),
                  SizedBox(
                    width: double.infinity,
                    child: FilledButton.icon(
                      onPressed: _busy ? null : _finish,
                      icon: _busy
                          ? const SizedBox.square(
                              dimension: 18,
                              child: CircularProgressIndicator(strokeWidth: 2),
                            )
                          : const Icon(Icons.arrow_forward_rounded),
                      label: const Text('Continue'),
                    ),
                  ),
                  const SizedBox(height: 10),
                  Text(
                    'Android will ask for permissions only when they are needed. You can review them later in Settings.',
                    textAlign: TextAlign.center,
                    style: theme.textTheme.bodySmall?.copyWith(
                      color: scheme.onSurfaceVariant,
                    ),
                  ),
                ],
              ),
            ),
          ),
        ),
      ),
    );
  }
}

class _WelcomePoint extends StatelessWidget {
  const _WelcomePoint({required this.icon, required this.text});

  final IconData icon;
  final String text;

  @override
  Widget build(BuildContext context) {
    final theme = Theme.of(context);
    final scheme = theme.colorScheme;
    return Padding(
      padding: const EdgeInsets.only(bottom: 13),
      child: Row(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          SizedBox(
            width: 40,
            height: 40,
            child: Center(child: Icon(icon, size: 22, color: scheme.primary)),
          ),
          const SizedBox(width: 10),
          Expanded(
            child: Padding(
              padding: const EdgeInsets.only(top: 9),
              child: Text(
                text,
                style: theme.textTheme.bodyMedium?.copyWith(height: 1.4),
              ),
            ),
          ),
        ],
      ),
    );
  }
}
'''
          Path('lib/features/onboarding/onboarding_screen.dart').write_text(onboarding)

          app = 'lib/app/app.dart'
          rep(app,
              '''    setState(() => _onboardingDone = true);\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (mounted) _offerNotificationPermission();\n    });\n  }\n\n  Future<void> _offerNotificationPermission() async {\n    final enable = await showDialog<bool>(\n      context: context,\n      barrierDismissible: false,\n      builder: (dialogContext) => AlertDialog(\n        icon: const OtyaLogo(iconOnly: true, fontSize: 48),\n        title: const Text('Enable OTYA notifications?'),\n        content: const Text(\n          'Notifications provide Now Playing controls, completed local-task alerts, account/security messages and OTYA update notices. You can change this later in Android settings.',\n        ),\n        actions: [\n          TextButton(\n            onPressed: () => Navigator.of(dialogContext).pop(false),\n            child: const Text('Not now'),\n          ),\n          FilledButton(\n            onPressed: () => Navigator.of(dialogContext).pop(true),\n            child: const Text('Enable'),\n          ),\n        ],\n      ),\n    );\n    if (enable == true) {\n      await NotificationService.instance.requestPermission();\n    }\n  }''',
              '''    setState(() => _onboardingDone = true);\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      if (!mounted) return;\n      unawaited(\n        NotificationService.instance.requestPermission().catchError((_) {}),\n      );\n    });\n  }''')

          main = 'lib/main.dart'
          old_pre = '''  MediaKit.ensureInitialized();\n\n  await SystemChrome.setPreferredOrientations(const [\n    DeviceOrientation.portraitUp,\n    DeviceOrientation.portraitDown,\n    DeviceOrientation.landscapeLeft,\n    DeviceOrientation.landscapeRight,\n  ]);\n\n  // Android 15+ is edge-to-edge by default when targeting API 35. Explicitly\n  // opt into the same behavior on older supported Android versions so OTYA has\n  // one predictable inset model instead of two visually different shells.\n  await SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);\n  SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(\n    statusBarColor: Colors.transparent,\n    statusBarIconBrightness: Brightness.light,\n    systemNavigationBarColor: Colors.transparent,\n    systemNavigationBarDividerColor: Colors.transparent,\n    systemNavigationBarIconBrightness: Brightness.light,\n    systemNavigationBarContrastEnforced: false,\n  ));\n\n'''
          rep(main, old_pre, '')

          old_audio = '''  try {\n    final audioHandler = await AudioService.init(\n      builder: () => OtyaAudioHandler(),\n      config: AudioServiceConfig(\n        androidNotificationChannelId: 'com.otyaplayer.app.audio',\n        androidNotificationChannelName: 'OTYA — Now Playing',\n        androidNotificationOngoing: true,\n        androidStopForegroundOnPause: false,\n        androidNotificationIcon: 'drawable/ic_notification',\n        notificationColor: const Color(0xFF8B5CF6),\n        androidShowNotificationBadge: false,\n        preloadArtwork: true,\n      ),\n    );\n    AudioHandlerSingleton.instance.handler = audioHandler;\n  } catch (e, st) {\n    debugPrint('[AudioService] init failed: $e\\n$st');\n    CrashReporter.instance.report(e, st);\n  }\n\n'''
          rep(main, old_audio, '')

          rep(main,
              '''Future<void> _initBackground(\n  AppSettings savedSettings,\n  bool databaseReady,\n) async {\n  await _safeBackground('notifications', _initNotifications);''',
              '''Future<void> _initBackground(\n  AppSettings savedSettings,\n  bool databaseReady,\n) async {\n  await _safeBackground('playback platform', _initPlaybackPlatform);\n  await _safeBackground('notifications', _initNotifications);''')

          marker = '''Future<void> _safeBackground(\n  String name,\n  Future<void> Function() task,\n) async {'''
          insert = '''Future<void> _initPlaybackPlatform() async {\n  // First frame must never wait on native playback or notification plugins.\n  // Initialize them only after OTYA has already rendered a usable Flutter UI.\n  MediaKit.ensureInitialized();\n\n  await SystemChrome.setPreferredOrientations(const [\n    DeviceOrientation.portraitUp,\n    DeviceOrientation.portraitDown,\n    DeviceOrientation.landscapeLeft,\n    DeviceOrientation.landscapeRight,\n  ]);\n  await SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);\n  SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(\n    statusBarColor: Colors.transparent,\n    statusBarIconBrightness: Brightness.light,\n    systemNavigationBarColor: Colors.transparent,\n    systemNavigationBarDividerColor: Colors.transparent,\n    systemNavigationBarIconBrightness: Brightness.light,\n    systemNavigationBarContrastEnforced: false,\n  ));\n\n  final audioHandler = await AudioService.init(\n    builder: () => OtyaAudioHandler(),\n    config: AudioServiceConfig(\n      androidNotificationChannelId: 'com.otyaplayer.app.audio',\n      androidNotificationChannelName: 'OTYA — Now Playing',\n      androidNotificationOngoing: true,\n      androidStopForegroundOnPause: false,\n      androidNotificationIcon: 'drawable/ic_notification',\n      notificationColor: const Color(0xFF8B5CF6),\n      androidShowNotificationBadge: false,\n      preloadArtwork: true,\n    ),\n  );\n  AudioHandlerSingleton.instance.handler = audioHandler;\n}\n\n'''
          rep(main, marker, insert + marker)
          PY
          git diff --check
      - name: Validate app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit stabilization
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/startup-onboarding-patch.yml
          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/main.dart lib/app/app.dart lib/features/onboarding/onboarding_screen.dart
          git diff --cached --check
          git commit -m 'fix: stabilize startup and simplify onboarding'
          git push origin HEAD:v1-rebuild
