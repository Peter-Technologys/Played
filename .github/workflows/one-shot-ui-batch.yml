name: OTYA UI batch
on:
  push:
    paths:
      - 'tools/apply_ui_batch.py'
      - '.github/workflows/one-shot-ui-batch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply UI source migration
        run: python3 tools/apply_ui_batch.py
      - name: Commit UI changes
        run: |
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/music/presentation/music_tab_screen.dart lib/features/video/presentation/video_tab_screen.dart lib/features/my_space/presentation/my_space_hub_screen.dart lib/features/settings/presentation/theme_selection_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show wallpapers in libraries and simplify UI grids'
          git push
