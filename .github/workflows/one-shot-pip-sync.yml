name: One-shot OTYA PiP play-state repair

on:
  push:
    branches: [fix/video-pip-play-state-2026-09-01]
    paths:
      - '.github/workflows/one-shot-pip-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/video-pip-play-state-2026-09-01
          fetch-depth: 0
      - name: Apply exact PiP state synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/player/presentation/video_player_screen.dart')
          text = path.read_text()

          replacements = [
            (
              """    await PipService.instance.setVideoPlaying(playing: true);\n    _pipInitialized = true;""",
              """    await PipService.instance.setVideoPlaying(playing: _isPlaying);\n    _pipInitialized = true;""",
            ),
            (
              """    if (state == AppLifecycleState.paused && _pipAutoEnabled && _pipSupported) {\n      PipService.instance.enterPip();\n    }""",
              """    if (state == AppLifecycleState.paused &&\n        _pipAutoEnabled &&\n        _pipSupported &&\n        _isPlaying) {\n      PipService.instance.enterPip();\n    }""",
            ),
            (
              """    _playingSub = player.stream.playing.listen((playing) {\n      if (mounted) setState(() => _isPlaying = playing);\n    });""",
              """    _playingSub = player.stream.playing.listen((playing) {\n      if (mounted) setState(() => _isPlaying = playing);\n      if (_pipInitialized) {\n        unawaited(PipService.instance.setVideoPlaying(playing: playing));\n      }\n    });""",
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one PiP source match, found {count}: {old[:80]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)

          test = Path('test/video_pip_play_state_contract_test.dart')
          test.write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('video PiP follows actual playback state', () {\n    final source = File('lib/features/player/presentation/video_player_screen.dart')\n        .readAsStringSync();\n\n    expect(\n      source,\n      contains('setVideoPlaying(playing: _isPlaying)'),\n    );\n    expect(\n      source,\n      contains('setVideoPlaying(playing: playing)'),\n    );\n    expect(source, contains('_pipSupported &&\\n        _isPlaying'));\n  });\n\n  test('paused video cannot auto-enter PiP from lifecycle pause', () {\n    final source = File('lib/features/player/presentation/video_player_screen.dart')\n        .readAsStringSync();\n    final lifecycle = source.substring(\n      source.indexOf('void didChangeAppLifecycleState'),\n      source.indexOf('void _resetHideTimer'),\n    );\n\n    expect(lifecycle, contains('_isPlaying'));\n    expect(lifecycle, contains('PipService.instance.enterPip()'));\n  });\n}\n""")
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-pip-sync.yml
          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/player/presentation/video_player_screen.dart test/video_pip_play_state_contract_test.dart
          git diff --cached --check
          git commit -m 'Synchronize video PiP with playback state'
          git push origin HEAD:fix/video-pip-play-state-2026-09-01
