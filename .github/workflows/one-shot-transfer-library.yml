name: One-shot OTYA Transfer library integration

on:
  push:
    branches: [fix/transfer-library-integration-2026-09-01]
    paths:
      - '.github/workflows/one-shot-transfer-library.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/transfer-library-integration-2026-09-01
          fetch-depth: 0
      - name: Apply exact Transfer library integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scanner = Path('lib/core/services/media_scanner_service.dart')
          text = scanner.read_text()

          old_import = "import 'package:flutter/services.dart';\n"
          new_import = "import 'package:flutter/services.dart';\nimport 'package:path_provider/path_provider.dart';\n"
          if text.count(old_import) != 1:
            raise SystemExit('Unexpected media scanner import layout')
          text = text.replace(old_import, new_import, 1)

          old_scan = """  Future<List<MediaItem>> _scanReceiveDirs(Set<String> alreadySeen) async {\n    final existChecks = await Future.wait(\n      _receiveDirs.map((p) => Directory(p).exists().catchError((_) => false)),\n    );\n    final existingDirs = [\n      for (var i = 0; i < _receiveDirs.length; i++)\n        if (existChecks[i]) _receiveDirs[i],\n    ];"""
          new_scan = """  Future<List<MediaItem>> _scanReceiveDirs(Set<String> alreadySeen) async {\n    final candidates = <String>[..._receiveDirs];\n    try {\n      final appExternal = await getExternalStorageDirectory();\n      if (appExternal != null) {\n        candidates.add('${appExternal.path}/OTYA_Received');\n      }\n    } catch (_) {}\n    final uniqueCandidates = candidates.toSet().toList(growable: false);\n    final existChecks = await Future.wait(\n      uniqueCandidates.map((p) => Directory(p).exists().catchError((_) => false)),\n    );\n    final existingDirs = [\n      for (var i = 0; i < uniqueCandidates.length; i++)\n        if (existChecks[i]) uniqueCandidates[i],\n    ];"""
          if text.count(old_scan) != 1:
            raise SystemExit('Unexpected receive-directory scan layout')
          scanner.write_text(text.replace(old_scan, new_scan, 1))

          screen = Path('lib/features/transfer/presentation/transfer_screen.dart')
          text = screen.read_text()
          scanner_import = "import '../../../core/services/media_scanner_service.dart';\n"
          if text.count(scanner_import) != 1:
            raise SystemExit('Unexpected Transfer scanner import layout')
          text = text.replace(scanner_import, '', 1)

          old_refresh = """      MediaRepository.instance.invalidate();\n      await MediaScannerService.instance.scanDirectory(dir.path);\n      if (!mounted) return;\n      setState(() {"""
          new_refresh = """      MediaRepository.instance.invalidate();\n      await ref.read(mediaLibraryProvider.notifier).refresh();\n      if (!mounted) return;\n      setState(() {"""
          if text.count(old_refresh) != 1:
            raise SystemExit('Unexpected Transfer completion refresh layout')
          screen.write_text(text.replace(old_refresh, new_refresh, 1))

          Path('test/transfer_library_integration_contract_test.dart').write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('normal media scans include OTYA received app storage', () {\n    final source = File('lib/core/services/media_scanner_service.dart')\n        .readAsStringSync();\n\n    expect(source, contains('getExternalStorageDirectory()'));\n    expect(source, contains("candidates.add('\\${appExternal.path}/OTYA_Received')"));\n    expect(source, contains('uniqueCandidates'));\n  });\n\n  test('completed Transfer refreshes the normal media library', () {\n    final source = File('lib/features/transfer/presentation/transfer_screen.dart')\n        .readAsStringSync();\n\n    expect(source, contains('MediaRepository.instance.invalidate();'));\n    expect(\n      source,\n      contains('ref.read(mediaLibraryProvider.notifier).refresh()'),\n    );\n    expect(source, isNot(contains('MediaScannerService.instance.scanDirectory(dir.path)')));\n  });\n}\n""")
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-transfer-library.yml
          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/services/media_scanner_service.dart lib/features/transfer/presentation/transfer_screen.dart test/transfer_library_integration_contract_test.dart
          git diff --cached --check
          git commit -m 'Make received Transfer media discoverable'
          git push origin HEAD:fix/transfer-library-integration-2026-09-01
