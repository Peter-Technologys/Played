name: One-shot video library density fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-video-library-density-fix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix oversized thumbnails and legacy accents
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/video/presentation/video_tab_screen.dart')
          s = p.read_text()

          replacements = {
            '        itemExtent: 102,': '        itemExtent: 86,',
            '/// Layout: [Thumbnail Stack (130×75) | Metadata Column | 3-dot menu]': '/// Layout: [Compact 16:9 thumbnail | Metadata Column | 3-dot menu]',
            '        margin: const EdgeInsets.only(bottom: 10),\n        padding: const EdgeInsets.all(10),': '        margin: const EdgeInsets.only(bottom: 8),\n        padding: const EdgeInsets.all(8),',
            '            // ── LEFT: Thumbnail (130×75) ──────────────────────────────': '            // ── LEFT: Compact 16:9 thumbnail ─────────────────────────',
            '                width: 130,\n                height: 75,': '                width: 104,\n                height: 60,',
            '                            cacheWidth: 200,': '                            cacheWidth: 160,',
            '                      fontSize: 13,': '                      fontSize: 12,',
            '                    maxLines: 2,': '                    maxLines: 1,',
            '                  MediaQuery.of(context).size.width > 600 ? 16 / 11 : 16 / 13,': '                  MediaQuery.of(context).size.width > 600 ? 16 / 10.5 : 16 / 11,',
            '              ? 16 / 11\n              : 16 / 13,': '              ? 16 / 10.5\n              : 16 / 11,',
            '          childAspectRatio: 16 / 13,': '          childAspectRatio: 16 / 11,',
            '                        width: 40,\n                        height: 40,': '                        width: 34,\n                        height: 34,',
            '                            color: Colors.white, size: 26),': '                            color: Colors.white, size: 22),',
            "  Widget _gradientBg() => Container(\n    decoration: const BoxDecoration(\n      gradient: LinearGradient(\n        colors: [Color(0xFF1a1a2e), AppColors.accentViolet],\n        begin: Alignment.topLeft,\n        end: Alignment.bottomRight,\n      ),\n    ),\n    child: const Center(\n      child: Icon(Icons.movie_rounded, color: Colors.white38, size: 32),\n    ),\n  );": "  Widget _gradientBg() => Container(\n    color: const Color(0xFF171820),\n    child: const Center(\n      child: Icon(Icons.movie_rounded, color: AppColors.accent, size: 28),\n    ),\n  );",
          }

          for old, new in replacements.items():
            if old not in s:
              print(f'WARN: expected pattern not found: {old[:80]!r}')
            s = s.replace(old, new)

          old = '''                gradient: isActive\n                    ? const LinearGradient(\n                        colors: [AppColors.accent, AppColors.accentViolet],\n                      )\n                    : null,\n                color: isActive ? null : AppColors.surface,'''
          new = '''                color: isActive ? AppColors.accent : AppColors.surface,'''
          if old in s:
            s = s.replace(old, new)

          s = s.replace('color: isActive ? Colors.black : AppColors.textSecondary',
                        'color: isActive ? Colors.white : AppColors.textSecondary')

          p.write_text(s)

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/video/presentation/video_tab_screen.dart
          git commit -m 'Fix oversized video thumbnails and layout density'
          git push
