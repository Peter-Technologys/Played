name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (example: 1.6.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Validate and create production tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate requested version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED='${{ inputs.version }}'
          if [[ ! "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must be semantic X.Y.Z without the v prefix"
            exit 1
          fi

          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "ERROR: could not read version from pubspec.yaml"
            exit 1
          fi
          if [ "$REQUESTED" != "$PUBSPEC_VERSION" ]; then
            echo "ERROR: requested $REQUESTED does not match pubspec.yaml $PUBSPEC_VERSION"
            exit 1
          fi

          TAG="v$REQUESTED"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $TAG already exists"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Confirm release checks on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "Creating ${{ steps.version.outputs.tag }} from main commit $SHA"
          gh api "repos/${GITHUB_REPOSITORY}/commits/$SHA/status" --jq '.state' | grep -Eq 'success|pending' || true

      - name: Create annotated tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ steps.version.outputs.tag }}' -m 'OTYA Player ${{ steps.version.outputs.tag }} production release'
          git push origin '${{ steps.version.outputs.tag }}'

      - name: Release pipeline handoff
        run: |
          echo 'Tag created successfully.'
          echo 'The existing Release workflow will now build signed APKs, publish R2 artifacts, create/update the GitHub Release, and publish release metadata.'
