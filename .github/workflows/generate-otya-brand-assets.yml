name: Generate OTYA brand assets

on:
  push:
    branches:
      - design/otya-brand-assets-20260829
    paths:
      - assets/branding/otya_logo_master.svg
      - tools/generate_otya_brand_assets.py
      - .github/workflows/generate-otya-brand-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/otya-brand-assets-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow cairosvg

      - name: Generate OTYA assets
        run: python tools/generate_otya_brand_assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/icons \
            assets/animations \
            assets/branding/otya_splash_reference.png \
            android/app/src/main/res/drawable \
            android/app/src/main/res/drawable-* \
            android/app/src/main/res/mipmap-* \
            android/app/src/main/res/values/otya_brand_colors.xml \
            ios/Runner/Assets.xcassets/AppIcon.appiconset \
            web \
            store_assets
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "brand: generate complete OTYA icon and drawable pack"
            git push origin HEAD:design/otya-brand-assets-20260829
          fi
