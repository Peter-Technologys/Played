name: Validate Otya release mode

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-mode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"

jobs:
  release_mode:
    name: Build release-mode publication candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Block tracked secrets and signing material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(google-services.*\.json|.*firebase-adminsdk.*\.json|.*service-account.*\.json|.*\.jks|.*\.keystore|.*\.p12|.*\.pem)$'; then
            echo 'ERROR: private credentials/signing files must not be tracked'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Ensure Android debug key exists for non-publishable release-mode test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Build release-mode ARM64 APK
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          OTYA_ALLOW_DEBUG_SIGNING: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_API_KEY" || { echo 'ERROR: FIREBASE_API_KEY is missing'; exit 1; }
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=SELF_UPDATE=true \
            --dart-define=GOOGLE_WEB_CLIENT_ID="82776565585-obr8k53b8n6djsggissv8qne81cm3u5u.apps.googleusercontent.com" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="1:82776565585:android:085cf9b4eecb76e9535570" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="82776565585" \
            --dart-define=FIREBASE_PROJECT_ID="otya-player"
          cp build/app/outputs/flutter-apk/app-release.apk build/Otya-release-mode-test.apk

      - name: Verify release-mode Android contract
        shell: bash
        run: |
          set -euo pipefail
          APK='build/Otya-release-mode-test.apk'
          test -s "$APK" || { echo 'ERROR: release-mode APK missing'; exit 1; }
          test "$(stat -c%s "$APK")" -gt 5000000 || { echo 'ERROR: release-mode APK is unexpectedly small'; exit 1; }

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/Otya-release-mode-signing.txt

          APKKIT="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print | sort | tail -n 1)"
          test -x "$APKKIT" || { echo 'ERROR: apkanalyzer not found'; exit 1; }
          "$APKKIT" manifest print "$APK" > build/Otya-release-mode-manifest.xml

          grep -q 'com.ryanheise.audioservice.AudioService' build/Otya-release-mode-manifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' build/Otya-release-mode-manifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' build/Otya-release-mode-manifest.xml
          grep -q 'android.permission.NEARBY_WIFI_DEVICES' build/Otya-release-mode-manifest.xml
          grep -q 'android:icon="@ref/0x' build/Otya-release-mode-manifest.xml || true

          sha256sum "$APK" | tee build/Otya-release-mode-checksum.txt

      - name: Save release-mode evidence
        uses: actions/upload-artifact@v4
        with:
          name: Otya-release-mode-validation
          if-no-files-found: error
          retention-days: 7
          path: |
            build/Otya-release-mode-test.apk
            build/Otya-release-mode-signing.txt
            build/Otya-release-mode-manifest.xml
            build/Otya-release-mode-checksum.txt
