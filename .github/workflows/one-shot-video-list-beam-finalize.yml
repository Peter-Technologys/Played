name: One-shot video list and Beam finalize
# Execute once, then remove this workflow.

on:
  push:
    paths:
      - .github/workflows/one-shot-video-list-beam-finalize.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply final cleanup
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/features/video/presentation/video_tab_screen.dart')
          s = p.read_text()

          folder_old = '''      body: GridView.builder(
        padding: EdgeInsets.fromLTRB(16, 12, 16,
            MediaQuery.of(context).padding.bottom + 120),
        gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
          crossAxisCount: MediaQuery.of(context).size.width > 600 ? 3 : 2,
          crossAxisSpacing: 12,
          mainAxisSpacing: 12,
          childAspectRatio: MediaQuery.of(context).size.width > 600
              ? 16 / 10.5
              : 16 / 11,
        ),
        itemCount: items.length,
        itemBuilder: (context, i) {
          final item = items[i];
          return _VideoCard(
            item: item,
            onTap: () {
              HapticFeedback.lightImpact();
              ref
                  .read(queueProvider.notifier)
                  .setQueue(items, startIndex: i);
              context.push('/player/video', extra: item);
            },
          );
        },
      ),'''
          folder_new = '''      body: ListView.builder(
        padding: EdgeInsets.fromLTRB(16, 12, 16,
            MediaQuery.of(context).padding.bottom + 120),
        itemExtent: 86,
        itemCount: items.length,
        itemBuilder: (context, i) {
          final item = items[i];
          return _VideoListItem(
            item: item,
            onTap: () {
              HapticFeedback.lightImpact();
              ref.read(queueProvider.notifier).setQueue(items, startIndex: i);
              context.push('/player/video', extra: item);
            },
          );
        },
      ),'''
          if folder_old not in s:
              raise SystemExit('folder grid block not found')
          s = s.replace(folder_old, folder_new)

          search_old = '''      child: GridView.builder(
        padding: const EdgeInsets.fromLTRB(16, 12, 16, 40),
        gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
          crossAxisCount: MediaQuery.of(context).size.width > 600 ? 3 : 2,
          crossAxisSpacing: 12,
          mainAxisSpacing: 12,
          childAspectRatio: 16 / 11,
        ),
        itemCount: results.length,
        itemBuilder: (context, i) {
          final item = results[i];
          return _VideoCard(
            item: item,
            onTap: () {
              ref
                  .read(queueProvider.notifier)
                  .setQueue(results, startIndex: i);
              close(context, item);
              context.push('/player/video', extra: item);
            },
          );
        },
      ),'''
          search_new = '''      child: ListView.builder(
        padding: const EdgeInsets.fromLTRB(16, 12, 16, 40),
        itemExtent: 86,
        itemCount: results.length,
        itemBuilder: (context, i) {
          final item = results[i];
          return _VideoListItem(
            item: item,
            onTap: () {
              ref.read(queueProvider.notifier).setQueue(results, startIndex: i);
              close(context, item);
              context.push('/player/video', extra: item);
            },
          );
        },
      ),'''
          if search_old not in s:
              raise SystemExit('search grid block not found')
          s = s.replace(search_old, search_new)
          p.write_text(s)

          p = Path('lib/features/air_drop/presentation/air_drop_screen.dart')
          s = p.read_text()
          apk_method = '''  Future<void> shareApk() async {
    state = state.copyWith(sendStep: _SendStep.serving, serverUrl: null);
    _log('Preparing APK…');
    try {
      final url = await _sender.startServingApk();
      if (url == null) { _log('APK not found.'); state = state.copyWith(sendStep: _SendStep.idle); return; }
      state = state.copyWith(serverUrl: url);
      _log('APK ready. Show QR.');
    } catch (e) { _log('APK error: $e'); state = state.copyWith(sendStep: _SendStep.idle); }
  }

'''
          if apk_method not in s:
              raise SystemExit('Beam APK method not found')
          s = s.replace(apk_method, '')

          apk_button = '''          // Share APK
          _GlassButton(
            icon: Icons.install_mobile_rounded,
            label: 'Beam OTYA Player APK',
            subtitle: 'Let friends install without internet',
            color: AppColors.accentViolet,
            onTap: () => n.shareApk(),
          ),
          const SizedBox(height: 8),
'''
          if apk_button not in s:
              raise SystemExit('Beam APK button not found')
          s = s.replace(apk_button, '')

          media_scan = '''      MediaRepository.instance.invalidate();
      await MediaScannerService.instance.scanDirectory(saveDir.path);
      state = state.copyWith('''
          media_scan_new = '''      final extension = fileName.contains('.')
          ? fileName.split('.').last.toLowerCase()
          : '';
      const mediaExtensions = {
        'mp4', 'mkv', 'avi', 'mov', 'webm', 'ts',
        'mp3', 'aac', 'flac', 'wav', 'ogg', 'm4a', 'opus',
      };
      if (mediaExtensions.contains(extension)) {
        MediaRepository.instance.invalidate();
        await MediaScannerService.instance.scanDirectory(saveDir.path);
      }
      state = state.copyWith('''
          if media_scan not in s:
              raise SystemExit('Beam media scan block not found')
          s = s.replace(media_scan, media_scan_new)
          p.write_text(s)

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/video/presentation/video_tab_screen.dart lib/features/air_drop/presentation/air_drop_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use one-column video lists and finalize Beam transfer'
          git push
