name: One-shot zero-warning patch

on:
  push:
    branches: [v1-rebuild]
    paths:
      - '.github/workflows/zero-warning-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v5
        with:
          ref: v1-rebuild
          fetch-depth: 0
      - name: Apply exact source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact match(es), found {actual}')
              p.write_text(text.replace(old, new, count))

          replace_exact(
              'lib/core/services/media_kit_engine.dart',
              '    final delta  = const Duration(seconds: 10);',
              '    const delta = Duration(seconds: 10);',
          )

          replace_exact(
              'lib/features/my_space/presentation/my_space_hub_screen.dart',
              '  }) async {\n    await showModalBottomSheet<void>(',
              '  }) async {\n    String? busyId;\n    String? result;\n    double progress = 0;\n    await showModalBottomSheet<void>(',
          )
          replace_exact(
              'lib/features/my_space/presentation/my_space_hub_screen.dart',
              '        builder: (context, setState) {\n          String? busyId;\n          String? result;\n          double progress = 0;\n          return SizedBox(',
              '        builder: (context, setState) {\n          return SizedBox(',
          )

          replace_exact(
              'lib/features/player/presentation/audio_player_screen.dart',
              '''      if (mounted) setState(() {\n        _resolvedPath = null;\n        _loading = false;\n      });''',
              '''      if (mounted) {\n        setState(() {\n          _resolvedPath = null;\n          _loading = false;\n        });\n      }''',
          )
          replace_exact(
              'lib/features/player/presentation/audio_player_screen.dart',
              '''      if (mounted) setState(() {\n        _resolvedPath = path;\n        _loading = false;\n      });''',
              '''      if (mounted) {\n        setState(() {\n          _resolvedPath = path;\n          _loading = false;\n        });\n      }''',
          )
          replace_exact(
              'lib/features/player/presentation/audio_player_screen.dart',
              '''    if (mounted) setState(() => _loading = true);\n    final resolved = await AlbumArtService.instance.resolve(path);\n    if (mounted) setState(() {\n      _resolvedPath = resolved;\n      _loading = false;\n    });''',
              '''    if (mounted) {\n      setState(() => _loading = true);\n    }\n    final resolved = await AlbumArtService.instance.resolve(path);\n    if (mounted) {\n      setState(() {\n        _resolvedPath = resolved;\n        _loading = false;\n      });\n    }''',
          )

          replace_exact(
              'lib/features/player/presentation/video_player_screen.dart',
              "    if (bytes == null || bytes == 0) return 'Unknown';",
              "    if (bytes == 0) return 'Unknown';",
          )
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zero-warning-patch.yml
          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/services/media_kit_engine.dart \
                  lib/features/my_space/presentation/my_space_hub_screen.dart \
                  lib/features/player/presentation/audio_player_screen.dart \
                  lib/features/player/presentation/video_player_screen.dart
          git diff --cached --check
          git commit -m 'fix: clear final Flutter analyzer diagnostics'
          git push origin HEAD:v1-rebuild
