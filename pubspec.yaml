name: played
description: A high-performance offline media player for East Africa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Media Playback
  flutter_vlc_player: ^7.4.1
  video_player: ^2.8.1
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # FFmpeg Processing
  ffmpeg_kit_flutter_min_gpl: ^6.0.3

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encryption / Vault
  encrypt: ^5.0.3
  crypto: ^3.0.3
  local_auth: ^2.1.8

  # Nearby Sharing
  nearby_connections: ^4.1.0

  # Audio Separation API
  http: ^1.1.0
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  sliding_up_panel: ^2.0.0+1

  # File System
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  file_picker: ^6.1.1

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Ads (non-intrusive)
  google_mobile_ads: ^4.0.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Sharing, URL launching, and PIN storage (wired up in audio player and settings)
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
