name: played
description: A high-performance offline media player for East Africa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Media Playback
  flutter_vlc_player: ^7.4.1
  # video_player removed — flutter_vlc_player covers all playback needs
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # FFmpeg Processing
  # NOTE: All ffmpeg_kit_flutter packages (ffmpeg_kit_flutter,
  # ffmpeg_kit_flutter_full_gpl, etc.) are discontinued — their native
  # Maven artifacts (com.arthenica:ffmpeg-kit-*:6.0-2) no longer exist
  # in any public repository and cannot be resolved during Android builds.
  # Removed until a working replacement is available.
  # See: https://github.com/arthenica/ffmpeg-kit/issues/367

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encryption / Vault
  encrypt: ^5.0.3
  crypto: ^3.0.3
  local_auth: ^2.1.8

  # Nearby Sharing
  nearby_connections: ^4.1.0

  # Audio Separation API
  http: ^1.1.0
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # UI & Animations
  flutter_animate: ^4.5.0
  # lottie removed — no .json files used; flutter_animate covers all animations
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  sliding_up_panel: ^2.0.0+1

  # File System
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  file_picker: ^8.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Ads (non-intrusive)
  google_mobile_ads: ^4.0.0

  # Secure storage for vault key
  flutter_secure_storage: ^9.2.2

  # Connectivity — defer ads/Firebase when offline
  connectivity_plus: ^6.0.3

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.8

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Sharing, URL launching, and PIN storage (wired up in audio player and settings)
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
