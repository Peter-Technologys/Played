name: otya_player
description: OTYA Player — A premium offline media player inspired by the Luganda word "Otya?".
publish_to: 'none'
version: 1.6.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Media Playback — media_kit is the single engine for audio + video.
  # Hardware-accelerated via MediaCodec on Android. No other playback
  # packages are used.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encryption / Vault
  encrypt: ^5.0.3
  crypto: ^3.0.5
  local_auth: ^2.3.0

  # Flash Share (pure Dart HTTP — replaces nearby_connections which required
  # CMake native compilation and caused CI runner timeouts)
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

  # HTTP
  http: ^1.2.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.0

  # Navigation
  go_router: ^14.6.0

  # UI & Animations
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Device info — used for ABI detection + update checker
  device_info_plus: ^10.1.0
  package_info_plus: ^8.1.0

  # File System
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Firebase — FCM push notifications (update alerts + announcements)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Secure storage for vault key
  flutter_secure_storage: ^9.2.4

  # Connectivity
  connectivity_plus: ^6.1.4
  network_info_plus: ^6.1.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8

  # Sharing, URL launching, PIN storage
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5

  # APK in-app download + install
  dio: ^5.7.0
  open_filex: ^4.7.0

  # Google Fonts (Fredoka for display/headline text)
  google_fonts: ^6.2.1

  # Background audio — keeps media_kit Player alive when app is backgrounded.
  # Provides Android foreground service + system MediaSession (lock-screen
  # controls, Bluetooth headset buttons, notification media controls).
  audio_service: ^0.18.15

  # In-app WebView
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
