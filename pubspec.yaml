name: otya_player
description: OTYA Player — A premium offline media player inspired by the Luganda word "Otya?".
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Media Playback
  flutter_vlc_player: ^7.4.1
  just_audio: ^0.9.36
  audio_service: ^0.18.13
  audio_session: ^0.1.18

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encryption / Vault
  encrypt: ^5.0.3
  crypto: ^3.0.3
  local_auth: ^2.1.8

  # Nearby Sharing
  nearby_connections: ^4.3.0

  # Appwrite — cloud sync, auth, backup, release tracking
  # v17.x uses flutter_web_auth_2 ^4.x which is Kotlin 2.x compatible
  appwrite: ^17.1.0

  # HTTP
  http: ^1.1.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # UI & Animations
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  sliding_up_panel: ^2.0.0+1

  # Device info — used for ABI detection + update checker
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # File System
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  file_picker: ^8.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Background update checks (WorkManager wrapper)
  workmanager: ^0.5.2

  # Secure storage for vault key
  flutter_secure_storage: ^9.2.2

  # Battery — used by OtyaVideoPanel to show level in fullscreen
  battery_plus: ^6.2.1

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.8

  # Sharing, URL launching, PIN storage
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
