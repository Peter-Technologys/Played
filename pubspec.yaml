name: otya_player
description: OTYA — a private, reliable Android media experience for video, music, transfer, files and local tools.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Media Playback — media_kit is the single engine for audio + video.
  # Android release builds are temporarily pinned to the reviewed upstream
  # disposal-order fix from media-kit PR #1424. That immutable revision keeps
  # the NativeCallable alive until mpv_terminate_destroy completes, preventing
  # the SIGABRT seen in OTYA's Samsung Android 16 bug report. Replace this pin
  # only after upstream ships an equivalent production fix.
  media_kit: 1.2.6
  media_kit_video: 1.3.1
  media_kit_libs_android_video: 1.3.8

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.3.1
  connectivity_plus: ^6.1.5
  file: ^7.0.1
  http: ^1.6.0
  crypto: ^3.0.7
  uuid: ^4.6.0
  mime: ^2.0.0
  sqflite: ^2.4.2
  safe_local_storage: ^2.0.6
  image: ^4.9.2
  cached_network_image: ^3.4.1
  octo_image: ^2.1.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  webview_flutter: ^4.9.0
  image_picker: ^1.2.1
  local_auth: ^2.3.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  volume_controller: ^3.4.4
  wakelock_plus: ^1.3.3
  screen_brightness_android: ^2.1.6
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.2+10
  firebase_analytics: ^11.6.0
  firebase_performance: ^0.10.1+10
  google_sign_in: ^6.3.0
  mobile_scanner: ^6.0.11
  qr_flutter: ^4.1.0
  otya_media_tools:
    path: packages/otya_media_tools
  otya_transfer_android:
    path: packages/otya_transfer_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.3
  hive_generator: ^2.0.1
  json_serializable: ^6.9.0
  custom_lint_core: ^0.7.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/branding/
    - assets/animations/
    - assets/strings/

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/Priyanshu-Mallick/media-kit.git
      ref: 9e170689b3fbbe75f866b6e387c5745155527515
      path: media_kit
