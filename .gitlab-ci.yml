# OTYA Player - GitLab CI/CD Pipeline
#
# Stages:
#   prepare  - pub get
#   codegen  - dart build_runner (generates .g.dart / .freezed.dart files)
#   validate - flutter analyze
#   test     - unit tests (MR only)
#   build    - debug APK on MR, release AAB+APK on tags
#   publish  - upload APKs + version.json to Cloudflare R2 (tags only)
#
# Required CI/CD Variables:
#   GOOGLE_SERVICES_JSON, KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   OTYA_SECRET (HMAC secret — injected at build time via --dart-define)
#   CF_ACCOUNT_ID, CF_API_TOKEN, KV_NAMESPACE_ID (Cloudflare KV for version manifest)

image: ghcr.io/cirruslabs/flutter:stable

# Explicitly define when pipelines run so tag pipelines are never skipped.
# Without this block, pipelines created from the GitLab UI tag page may not
# trigger because GitLab's default rules require a git push event.
workflow:
  rules:
    - when: never  # CI disabled — no pipelines will run

variables:
  PUB_ENVIRONMENT: "bot.gitlab"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  # Parallel builds + 4 GB heap. Daemon disabled (stateless CI runners).
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4 -Xmx4g -Dkotlin.incremental=false"
  R2_ENDPOINT: "https://6c76d2a9e5f95d5f9b393e97374d9afb.r2.cloudflarestorage.com"
  R2_BUCKET: "otya-player-releases"
  WORKER_URL: "https://petersmartlink.com"

stages:
  - prepare
  - codegen
  - validate
  - test
  - build
  - publish

cache:
  - key: "pub-v4-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "pub-v4-main"
      - "pub-v4"
    paths:
      - .pub-cache/
      - .dart_tool/
  - key: "gradle-v3-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "gradle-v3-main"
      - "gradle-v3"
    paths:
      - android/.gradle/
      - ~/.gradle/wrapper/
      - ~/.gradle/caches/modules-2/files-2.1/
      - ~/.gradle/caches/modules-2/metadata-2.1/
      # Cache the Android SDK CMake install so it is not re-downloaded every run
      - /usr/local/lib/android/sdk/cmake/

.free_disk_space: &free_disk_space |
  echo "=== Disk usage before cleanup ==="
  df -h
  sudo rm -rf /usr/local/lib/android/sdk/ndk || true
  sudo rm -rf /usr/share/dotnet || true
  sudo rm -rf /usr/local/share/powershell || true
  sudo rm -rf /usr/share/swift || true
  sudo rm -rf /opt/hostedtoolcache/CodeQL || true
  sudo apt-get clean -y || true
  echo "=== Disk usage after cleanup ==="
  df -h

.inject_google_services: &inject_google_services |
  if [ -z "$GOOGLE_SERVICES_JSON" ]; then
    echo "ERROR: GOOGLE_SERVICES_JSON variable is not set."
    exit 1
  fi
  echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

prepare:
  stage: prepare
  script:
    - flutter pub get
  artifacts:
    paths:
      - .dart_tool/
      - .pub-cache/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# Generates all .g.dart / .freezed.dart / hive adapter files required by
# freezed, riverpod_generator, json_serializable, and hive_generator.
# Without this step, builds and tests could use stale or missing generated code.
code_gen:
  stage: codegen
  needs: [prepare]
  script:
    - dart run build_runner build --delete-conflicting-outputs
  artifacts:
    paths:
      - lib/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

analyze:
  stage: validate
  # Depends on code_gen so generated files are present before analysis.
  needs: [code_gen]
  script:
    - flutter analyze --no-fatal-infos --no-fatal-warnings
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

unit_test:
  stage: test
  # Depends on code_gen so generated files are present for tests.
  needs: [code_gen]
  script:
    # Fix #14: use --reporter json to get coverage without apt-get/pip.
    # The lcov_cobertura conversion via apt-get added ~30s per MR pipeline.
    # flutter test --coverage still writes coverage/lcov.info for the
    # coverage regex below; we skip the cobertura conversion entirely since
    # GitLab can parse the lcov summary line directly from the test output.
    - flutter test --coverage
  coverage: '/lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build_apk_debug:
  stage: build
  # Only needs prepare; generated files are not required for a debug build
  # because .g.dart/.freezed.dart files should already be committed to the repo.
  needs: [prepare]
  script:
    - *free_disk_space
    - *inject_google_services
    # No --flavor flag: build.gradle has no product flavors defined.
    - flutter build apk --debug --no-pub
  artifacts:
    paths:
      # Output path without a flavor suffix.
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 3 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GOOGLE_SERVICES_JSON'
    - if: '$CI_COMMIT_BRANCH == "main" && $GOOGLE_SERVICES_JSON'
    - when: never

build_release:
  stage: build
  needs: [prepare]
  timeout: 45 minutes
  script:
    - *free_disk_space
    - *inject_google_services
    - |
      if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
        echo "ERROR: One or more signing variables are not set."
        exit 1
      fi
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
    - export KEYSTORE_PATH="$(pwd)/android/app/keystore.jks"
    - |
      flutter build apk --release --split-per-abi --no-pub \
        --target-platform android-arm,android-arm64 \
        --split-debug-info=build/debug-info \
        --dart-define=OTYA_SECRET="$OTYA_SECRET" \
        --dart-define=APP_ARCH=split \
        --dart-define=SELF_UPDATE=true
    # Verify APKs were produced before marking job successful
    - |
      for APK in \
        build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
        build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk; do
        if [ ! -f "$APK" ]; then
          echo "ERROR: Expected APK not found: $APK"
          ls -lh build/app/outputs/flutter-apk/ || true
          exit 1
        fi
        echo "OK: $APK ($(stat -c%s "$APK") bytes)"
      done
  after_script:
    # Always clean up secrets, even on failure
    - rm -f android/app/keystore.jks android/app/google-services.json
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/debug-info/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

publish_to_r2:
  stage: publish
  image: python:3.12-alpine
  needs: [build_release]
  before_script:
    - pip install awscli --quiet
    - apk add --no-cache curl bash
  script:
    - chmod +x scripts/publish_r2.sh
    - bash scripts/publish_r2.sh
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
  environment:
    name: production
    url: https://getotya.petersmartlink.com
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $R2_ACCESS_KEY_ID && $R2_SECRET_ACCESS_KEY'
  variables:
    AWS_ACCESS_KEY_ID: $R2_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $R2_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: auto
    CF_ACCOUNT_ID: $CF_ACCOUNT_ID
    CF_API_TOKEN: $CF_API_TOKEN
    KV_NAMESPACE_ID: $KV_NAMESPACE_ID
