# ─────────────────────────────────────────────────────────────
# OTYA Player — GitLab CI/CD Pipeline
# ─────────────────────────────────────────────────────────────

image: ghcr.io/cirruslabs/flutter:stable

variables:
  FLUTTER_VERSION: "stable"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  PUB_ENVIRONMENT: "bot.gitlab"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

stages:
  - prepare
  - validate
  - test
  - build

# ── Global cache — shared across ALL branches and jobs ───────────────
cache:
  key: "pub-cache-v1"
  paths:
    - .pub-cache/
    - .dart_tool/

# ── Shared script snippet: inject google-services.json ──────────────
.inject_google_services: &inject_google_services |
  if [ -z "$GOOGLE_SERVICES_JSON" ]; then
    echo "ERROR: GOOGLE_SERVICES_JSON variable is not set."
    echo "Go to GitLab → Settings → CI/CD → Variables and add it."
    exit 1
  fi
  echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
  echo "google-services.json injected successfully."

# ── PREPARE — runs once, artifacts passed to all downstream jobs ─────
prepare:
  stage: prepare
  script:
    - flutter pub get
    - flutter pub run build_runner build --delete-conflicting-outputs
  artifacts:
    paths:
      - .dart_tool/
      - .pub-cache/
      - lib/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ── Validate ────────────────────────────────────────────────────────
analyze:
  stage: validate
  needs: [prepare]
  script:
    - flutter analyze --no-fatal-infos --no-fatal-warnings
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

format_check:
  stage: validate
  needs: [prepare]
  script:
    - dart format --set-exit-if-changed lib/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true

# ── Test ──────────────────────────────────────────────────────────
unit_test:
  stage: test
  needs: [prepare]
  script:
    - flutter test --coverage
  coverage: '/lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Build ──────────────────────────────────────────────────────────
build_apk_debug:
  stage: build
  needs: [prepare]
  script:
    - *inject_google_services
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 3 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Signed release build — runs on main branch pushes and version tags.
# Required CI/CD Variables (Settings → CI/CD → Variables, all Masked + Protected):
#   GOOGLE_SERVICES_JSON — raw contents of google-services.json
#   KEYSTORE_BASE64      — Base64-encoded .jks keystore file
#   STORE_PASSWORD       — Keystore password
#   KEY_ALIAS            — Key alias inside the keystore
#   KEY_PASSWORD         — Key password
build_apk_release:
  stage: build
  needs: [prepare]
  script:
    - *inject_google_services
    - |
      if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
        echo "ERROR: One or more signing variables are not set."
        echo "Required: KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
        exit 1
      fi
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
    - export KEYSTORE_PATH="keystore.jks"
    - flutter build appbundle --release
        --obfuscate
        --split-debug-info=build/debug-info
    - flutter build apk --release --split-per-abi
        --obfuscate
        --split-debug-info=build/debug-info
    - rm -f android/app/keystore.jks
  artifacts:
    paths:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/debug-info/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
