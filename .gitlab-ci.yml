# ───────────────────────────────────────────────────────────────
# OTYA Player — GitLab CI/CD Pipeline
#
# Stage summary:
#   prepare  — pub get (once, shared via artifacts)
#   validate — flutter analyze
#   test     — unit tests (MR only)
#   build    — debug APK on MR, release AAB+APK on tags only
#   publish  — upload APKs + version.json to Cloudflare R2 (tags only)
# ───────────────────────────────────────────────────────────────

image: ghcr.io/cirruslabs/flutter:stable

variables:
  PUB_ENVIRONMENT: "bot.gitlab"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  # Disable Gradle daemon in CI — prevents long-lived processes
  # from holding onto disk and memory between tasks.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
  # R2 bucket endpoint — uses S3-compatible API
  R2_ENDPOINT: "https://6c76d2a9e5f95d5f9b393e97374d9afb.r2.cloudflarestorage.com"
  R2_BUCKET: "otya-player-releases"

stages:
  - prepare
  - validate
  - test
  - build
  - publish

# ── Global cache — shared across ALL branches and jobs ────────────────────────
cache:
  - key: "pub-cache-v2"
    paths:
      - .pub-cache/
      - .dart_tool/
  - key: "gradle-cache-v1-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "gradle-cache-v1-main"
      - "gradle-cache-v1"
    paths:
      - android/.gradle/
      - ~/.gradle/wrapper/
      - ~/.gradle/caches/modules-2/files-2.1/
      - ~/.gradle/caches/modules-2/metadata-2.1/

# ── Shared: free disk space before Android builds ────────────────────────────
.free_disk_space: &free_disk_space |
  echo "=== Disk usage before cleanup ==="
  df -h
  # Remove large pre-installed tools not needed for Flutter/Android builds
  sudo rm -rf /usr/local/lib/android/sdk/ndk || true
  sudo rm -rf /usr/share/dotnet || true
  sudo rm -rf /usr/local/share/powershell || true
  sudo rm -rf /usr/share/swift || true
  sudo apt-get clean -y || true
  echo "=== Disk usage after cleanup ==="
  df -h

# ── Shared: inject google-services.json ──────────────────────────────────────
.inject_google_services: &inject_google_services |
  if [ -z "$GOOGLE_SERVICES_JSON" ]; then
    echo "ERROR: GOOGLE_SERVICES_JSON variable is not set."
    exit 1
  fi
  echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

# ───────────────────────────────────────────────────────────────
# PREPARE — pub get only (no build_runner: no generated files change per push)
# ───────────────────────────────────────────────────────────────
prepare:
  stage: prepare
  script:
    - flutter pub get
  artifacts:
    paths:
      - .dart_tool/
      - .pub-cache/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ───────────────────────────────────────────────────────────────
# VALIDATE
# ───────────────────────────────────────────────────────────────
analyze:
  stage: validate
  needs: [prepare]
  script:
    - flutter analyze --no-fatal-infos --no-fatal-warnings
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ───────────────────────────────────────────────────────────────
# TEST — MR only (not on every main push)
# ───────────────────────────────────────────────────────────────
unit_test:
  stage: test
  needs: [prepare]
  script:
    - flutter test --coverage
  coverage: '/lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ───────────────────────────────────────────────────────────────
# BUILD
#
# Debug APK  — on every MR (fast, no signing needed, for quick testing)
# Release    — ONLY on version tags (v1.2.3) to avoid slow builds on every push
#
# To trigger a release build: git tag v1.2.3 && git push origin v1.2.3
#
# Required CI/CD Variables (Settings → CI/CD → Variables, Masked + Protected):
#   GOOGLE_SERVICES_JSON  — raw contents of google-services.json
#   KEYSTORE_BASE64       — Base64-encoded .jks keystore
#   STORE_PASSWORD        — Keystore password
#   KEY_ALIAS             — Key alias
#   KEY_PASSWORD          — Key password
#   R2_ACCESS_KEY_ID      — Cloudflare R2 Access Key ID
#   R2_SECRET_ACCESS_KEY  — Cloudflare R2 Secret Access Key
# ───────────────────────────────────────────────────────────────
build_apk_debug:
  stage: build
  needs: [prepare]
  script:
    - *free_disk_space
    - *inject_google_services
    - flutter build apk --debug --no-pub
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 3 days
  # Only run when GOOGLE_SERVICES_JSON is configured — skips gracefully
  # instead of hard-failing when the variable is absent on main pushes.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GOOGLE_SERVICES_JSON'
    - if: '$CI_COMMIT_BRANCH == "main" && $GOOGLE_SERVICES_JSON'

build_release:
  stage: build
  needs: [prepare]
  script:
    - *free_disk_space
    - *inject_google_services
    - |
      if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
        echo "ERROR: One or more signing variables are not set."
        echo "Required: KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
        exit 1
      fi
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
    - flutter build appbundle --release --no-pub
        --obfuscate
        --split-debug-info=build/debug-info
    - flutter build apk --release --split-per-abi --no-pub
        --target-platform android-arm,android-arm64
        --obfuscate
        --split-debug-info=build/debug-info
    - rm -f android/app/keystore.jks
  artifacts:
    paths:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-arm64-v8a-standard-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-standard-release.apk
      - build/debug-info/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $GOOGLE_SERVICES_JSON'
    - if: '$CI_COMMIT_BRANCH == "main" && $GOOGLE_SERVICES_JSON'

# ───────────────────────────────────────────────────────────────
# PUBLISH — upload APKs + version.json to Cloudflare R2
#
# Runs only on version tags (v1.2.3) after a successful build_release.
# Uses the S3-compatible API built into Cloudflare R2.
#
# Required CI/CD Variables (Masked + Protected):
#   R2_ACCESS_KEY_ID      — R2 API token Access Key ID
#   R2_SECRET_ACCESS_KEY  — R2 API token Secret Access Key
# ───────────────────────────────────────────────────────────────
publish_to_r2:
  stage: publish
  image: python:3.12-alpine
  needs: [build_release]
  script:
    - pip install awscli --quiet
    - |
      # Extract version number from the tag (strip leading 'v')
      VERSION=${CI_COMMIT_TAG#v}
      echo "Publishing version $VERSION to R2..."

      # Upload arm64 APK
      aws s3 cp \
        build/app/outputs/flutter-apk/app-arm64-v8a-standard-release.apk \
        s3://$R2_BUCKET/app-arm64-v8a-standard-release.apk \
        --endpoint-url $R2_ENDPOINT \
        --content-type application/vnd.android.package-archive \
        --cache-control "public, max-age=31536000, immutable"

      # Upload arm32 APK
      aws s3 cp \
        build/app/outputs/flutter-apk/app-armeabi-v7a-standard-release.apk \
        s3://$R2_BUCKET/app-armeabi-v7a-standard-release.apk \
        --endpoint-url $R2_ENDPOINT \
        --content-type application/vnd.android.package-archive \
        --cache-control "public, max-age=31536000, immutable"

      # Write and upload version.json — read by the download page
      echo "{\"version\":\"$VERSION\",\"tag\":\"$CI_COMMIT_TAG\",\"date\":\"$(date -u +%Y-%m-%d)\"}" > version.json
      aws s3 cp \
        version.json \
        s3://$R2_BUCKET/version.json \
        --endpoint-url $R2_ENDPOINT \
        --content-type application/json \
        --cache-control "public, max-age=300"

      echo "Done. Files live at https://getotya.download.apk.petersmartlink.com/"
  environment:
    name: production
    url: https://getotya.download.apk.petersmartlink.com
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $R2_ACCESS_KEY_ID && $R2_SECRET_ACCESS_KEY'


