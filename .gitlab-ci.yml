# ─────────────────────────────────────────────────────────────
# Played — GitLab CI/CD Pipeline
# ─────────────────────────────────────────────────────────────

image: ghcr.io/cirruslabs/flutter:stable

variables:
  FLUTTER_VERSION: "stable"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  # Suppress verbose pub dependency resolution output
  PUB_ENVIRONMENT: "bot.github"

stages:
  - validate
  - test
  - build

cache:
  key: "pub-$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - .dart_tool/

# ── Validate ────────────────────────────────────────────────────────
analyze:
  stage: validate
  script:
    - flutter pub get
    # Generate code (freezed, riverpod, json_serializable) before analyzing.
    # Without this step flutter analyze reports missing generated files as errors
    # because the project uses code generation for models and providers.
    - flutter pub run build_runner build --delete-conflicting-outputs
    - flutter analyze --no-fatal-infos --no-fatal-warnings
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

format_check:
  stage: validate
  script:
    - flutter pub get
    - dart format --set-exit-if-changed lib/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  # allow_failure: true so formatting issues don't block MR pipelines
  allow_failure: true

# ── Test ──────────────────────────────────────────────────────────
unit_test:
  stage: test
  script:
    - flutter pub get
    - flutter pub run build_runner build --delete-conflicting-outputs
    - flutter test --coverage
  coverage: '/lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Build ──────────────────────────────────────────────────────────
build_apk_debug:
  stage: build
  script:
    - flutter pub get
    - flutter pub run build_runner build --delete-conflicting-outputs
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 3 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Signed release APK — runs on main branch pushes and version tags.
# Requires the following CI/CD Variables (Settings → CI/CD → Variables):
#   KEYSTORE_BASE64  — Base64-encoded .jks keystore file (masked, protected)
#   STORE_PASSWORD   — Keystore password (masked, protected)
#   KEY_ALIAS        — Key alias inside the keystore (masked, protected)
#   KEY_PASSWORD     — Key password (masked, protected)
build_apk_release:
  stage: build
  script:
    - flutter pub get
    - flutter pub run build_runner build --delete-conflicting-outputs
    # Guard: fail early with a clear message if signing variables are missing.
    # Without this the build silently produces an unsigned APK that cannot
    # be installed on real devices or published to the Play Store.
    - |
      if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
        echo "ERROR: One or more signing variables are not set."
        echo "Required: KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
        echo "Set them in GitLab → Settings → CI/CD → Variables (Masked + Protected)."
        exit 1
      fi
    # Decode the Base64 keystore from CI variable into a file the build can use
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
    # Pass signing credentials via env vars (read by build.gradle signingConfigs.release)
    - export KEYSTORE_PATH="keystore.jks"
    - flutter build apk --release --split-per-abi
    # Remove keystore file so it is never included in artifacts
    - rm -f android/app/keystore.jks
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
