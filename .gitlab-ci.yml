# ─────────────────────────────────────────────────────────────
# Played — GitLab CI/CD Pipeline
# ─────────────────────────────────────────────────────────────

image: ghcr.io/cirruslabs/flutter:stable

variables:
  FLUTTER_VERSION: "stable"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  PUB_ENVIRONMENT: "bot.github"

stages:
  - validate
  - test
  - build

cache:
  key: "pub-$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - .dart_tool/

# ── Shared script snippet: inject google-services.json ──────────────
# GOOGLE_SERVICES_JSON must be set in GitLab → Settings → CI/CD → Variables
# as a File variable OR a masked variable containing the raw JSON content.
.inject_google_services: &inject_google_services |
  if [ -z "$GOOGLE_SERVICES_JSON" ]; then
    echo "ERROR: GOOGLE_SERVICES_JSON variable is not set."
    echo "Go to GitLab → Settings → CI/CD → Variables and add it."
    exit 1
  fi
  echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
  echo "google-services.json injected successfully."

# ── Validate ────────────────────────────────────────────────────────
analyze:
  stage: validate
  script:
    - flutter pub get
    - flutter pub run build_runner build --delete-conflicting-outputs
    - flutter analyze --no-fatal-infos --no-fatal-warnings
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

format_check:
  stage: validate
  script:
    - flutter pub get
    - dart format --set-exit-if-changed lib/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true

# ── Test ──────────────────────────────────────────────────────────
unit_test:
  stage: test
  script:
    - flutter pub get
    - flutter pub run build_runner build --delete-conflicting-outputs
    - flutter test --coverage
  coverage: '/lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Build ──────────────────────────────────────────────────────────
build_apk_debug:
  stage: build
  script:
    - *inject_google_services
    - flutter pub get
    - flutter pub run build_runner build --delete-conflicting-outputs
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 3 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Signed release APK — runs on main branch pushes and version tags.
# Required CI/CD Variables (Settings → CI/CD → Variables, all Masked + Protected):
#   GOOGLE_SERVICES_JSON — raw contents of google-services.json
#   KEYSTORE_BASE64      — Base64-encoded .jks keystore file
#   STORE_PASSWORD       — Keystore password
#   KEY_ALIAS            — Key alias inside the keystore
#   KEY_PASSWORD         — Key password
build_apk_release:
  stage: build
  script:
    - *inject_google_services
    - flutter pub get
    - flutter pub run build_runner build --delete-conflicting-outputs
    - |
      if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
        echo "ERROR: One or more signing variables are not set."
        echo "Required: KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
        exit 1
      fi
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
    - export KEYSTORE_PATH="keystore.jks"
    - flutter build apk --release --split-per-abi
    - rm -f android/app/keystore.jks
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
