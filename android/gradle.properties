org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# android.enableJetifier removed — all dependencies use AndroidX natively.
# Jetifier is no longer needed and only slows down builds.
android.enableR8.fullMode=true
kotlin.code.style=official
# Disable configuration cache — AGP 9.x + Flutter stable triggers an
# "Already watching path" file-watcher crash when configuration cache is
# active. Disabling it is the upstream-recommended workaround until Flutter
# ships a fix for the double-registration bug.
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=fail
