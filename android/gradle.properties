org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
android.useAndroidX=true
# android.enableJetifier removed — all dependencies use AndroidX natively.
# Jetifier is no longer needed and only slows down builds.
# R8 fullMode disabled — it strips interface default methods and type
# information required by media_kit, audio_service, and Flutter plugin
# registrars, causing an immediate crash on app launch in release builds.
# Standard R8 (fullMode=false) still shrinks and obfuscates effectively.
android.enableR8.fullMode=false
kotlin.code.style=official
# Configuration cache is left disabled — safe default for Flutter projects.
org.gradle.configuration-cache=false
# Disable Gradle's virtual file system watcher — it causes
# 'Already watching path' errors on GitHub Actions runners.
org.gradle.vfs.watch=false
