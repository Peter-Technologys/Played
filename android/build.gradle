// AGP version is declared in settings.gradle plugins {} block.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Keep Android/Gradle outputs under Flutter's repository-level build/
// directory. Flutter's APK tooling expects app outputs there after Gradle
// completes; without this mapping Gradle can succeed while `flutter build`
// reports that it cannot find the generated APK.
def flutterBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.set(flutterBuildDir)

subprojects {
    project.layout.buildDirectory.set(flutterBuildDir.dir(project.name))
}

// No compileSdk override, afterEvaluate, or plugins.withId hooks here.
// Those hooks previously triggered Flutter watcher issues. file_picker was
// also removed because it was unused and its pre-built AAR caused SDK
// compatibility failures.

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
