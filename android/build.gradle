// AGP version is declared in settings.gradle plugins {} block.
allprojects {
    repositories {
        google()
        mavenCentral()
        // Required for ffmpeg_kit_flutter_full_gpl native artifacts
        maven { url 'https://jitpack.io' }
        maven { url 'https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0/maven' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
