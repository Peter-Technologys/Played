// AGP version is declared in settings.gradle plugins {} block.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9: use layout.buildDirectory instead of deprecated buildDir assignment.
subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
}

// NOTE: evaluationDependsOn(':app') has been intentionally removed.
// It forced :app to be fully evaluated before this subprojects{} block ran,
// which caused Gradle 8+ to throw:
//   "Cannot run Project.afterEvaluate(Closure) when the project is already evaluated"
// AGP 8+ and Flutter's dev.flutter.flutter-plugin-loader handle task ordering
// automatically, so this line is no longer needed.

// Force all Flutter plugin subprojects to compile against SDK 36.
// Required because flutter_plugin_android_lifecycle mandates compileSdk >= 36
// and some plugins (e.g. file_picker) still declare compileSdk 34 internally.
// afterEvaluate is safe here now that evaluationDependsOn(':app') is removed.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null) {
                try {
                    def current = androidExt.compileSdkVersion
                    if (current == null || current < 36) {
                        androidExt.compileSdkVersion 36
                    }
                } catch (ignored) {
                    // compileSdk already set via integer property (AGP 8+ style)
                    // — try the integer setter instead.
                    try {
                        if (androidExt.compileSdk < 36) {
                            androidExt.compileSdk = 36
                        }
                    } catch (e2) {
                        logger.warn("[compileSdk override] Could not set compileSdk on ${project.name}: $e2")
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
