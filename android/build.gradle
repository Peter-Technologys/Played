// AGP version is declared in settings.gradle plugins {} block.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// No subprojects compileSdk override block.
// file_picker has been removed from pubspec.yaml (it was unused and its
// pre-built AAR compiled against SDK 34 caused the build to fail).
// afterEvaluate and plugins.withId() both trigger Flutter 3.47's
// "Already watching path" watcher crash and must NOT be used here.

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
