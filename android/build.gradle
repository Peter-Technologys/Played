// AGP version is declared in settings.gradle plugins {} block.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9: use layout.buildDirectory instead of deprecated buildDir assignment.
subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Force all Flutter plugin subprojects to compile against SDK 36.
// Uses configureEach (configuration-time) instead of afterEvaluate
// (post-evaluation) to avoid the Gradle 8+ error:
//   "Cannot run Project.afterEvaluate(Closure) when the project is already evaluated"
// This is triggered because evaluationDependsOn(':app') above causes :app to
// be fully evaluated before the afterEvaluate callbacks run on subprojects.
subprojects {
    plugins.withId('com.android.library') {
        android {
            compileSdkVersion 36
        }
    }
    plugins.withId('com.android.application') {
        // :app already sets compileSdk 36 in its own build.gradle.
        // This block is a no-op for :app but kept for completeness.
        android {
            compileSdkVersion 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
