// AGP version is declared in settings.gradle plugins {} block.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9: use layout.buildDirectory instead of deprecated buildDir assignment.
subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Force all Flutter plugin subprojects to compile against SDK 36.
// Required because flutter_plugin_android_lifecycle mandates compileSdk >= 36
// and some plugins (e.g. file_picker) still declare compileSdk 34 internally.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (compileSdkVersion < 36) {
                    compileSdkVersion 36
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
