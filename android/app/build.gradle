plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.otyaplayer.app"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId = "com.otyaplayer.app"
        minSdk = 21
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true

        // Broad locale support — covers all major markets
        resourceConfigurations += ["en", "fr", "es", "ar", "pt", "hi", "sw", "zh", "ru", "de", "tr", "id", "vi"]

        // Support library vector drawables for all screen densities
        vectorDrawables.useSupportLibrary = true
    }

    // No product flavors — single standard build for Google Play / sideload
    // ABI splitting is handled by Flutter's --split-per-abi flag at build time.

    signingConfigs {
        release {
            storeFile = file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword = System.getenv("STORE_PASSWORD")
            keyAlias = System.getenv("KEY_ALIAS")
            keyPassword = System.getenv("KEY_PASSWORD")
        }
    }

    packagingOptions {
        jniLibs {
            // media_kit loads libmpv.so at runtime via System.loadLibrary,
            // so native libs must be extracted from the APK.
            // AGP 8+ requires this to be set here instead of via
            // android:extractNativeLibs="true" in AndroidManifest.xml.
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
        debug {
            // Do NOT use applicationIdSuffix here.
            // audio_service registers its foreground service under the base
            // applicationId (com.otyaplayer.app). If the debug build uses a
            // different package (com.otyaplayer.app.debug), Android cannot
            // find the service declaration and playback silently fails.
            debuggable = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation("androidx.multidex:multidex:2.0.1")
    implementation("androidx.window:window:1.3.0")
    implementation("androidx.window:window-java:1.3.0")
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
    implementation("androidx.annotation:annotation:1.7.1")
    // WorkManager — required by UpdateCheckWorker
    implementation("androidx.work:work-runtime-ktx:2.9.1")
    // Coroutines — required by CoroutineWorker in UpdateCheckWorker
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
}
