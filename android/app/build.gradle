plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace 'com.otyaplayer.app'
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId 'com.otyaplayer.app'
        minSdk 21
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // ── Product flavors ──────────────────────────────────────────────────────
    // 'standard' : Google Play / sideload — includes AdMob
    // 'huawei'   : Huawei AppGallery — no GMS, AdMob meta-data removed via
    //              manifest placeholder so the app doesn't crash on HMS devices
    flavorDimensions 'store'
    productFlavors {
        standard {
            dimension 'store'
            // AdMob APPLICATION_ID is injected from the manifest directly
            manifestPlaceholders = [admobAppId: 'ca-app-pub-2517163652161686~2375986122']
        }
        huawei {
            dimension 'store'
            // Use a no-op AdMob ID — AdMob SDK is present but init is
            // guarded in Dart so it never actually calls GMS on Huawei.
            // Huawei AppGallery review requires no GMS runtime calls.
            manifestPlaceholders = [admobAppId: 'ca-app-pub-0000000000000000~0000000000']
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("STORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Do NOT use applicationIdSuffix here.
            // audio_service registers its foreground service under the base
            // applicationId (com.otyaplayer.app). If the debug build uses a
            // different package (com.otyaplayer.app.debug), Android cannot
            // find the service declaration and playback silently fails.
            debuggable true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.window:window:1.2.0'
    implementation 'androidx.window:window-java:1.2.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
